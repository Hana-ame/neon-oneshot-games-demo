<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>黏黏世界 · Web World of Goo</title>
  <style>
    :root {
      --bg-dark: #0b1320;
      --surface: rgba(15, 23, 36, 0.88);
      --surface-hover: rgba(30, 41, 59, 0.95);
      --border: rgba(148, 163, 184, 0.22);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #7bf1a8;
      --accent-dark: #15803d;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      z-index: 20;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #95d5b2, #1b4332);
      box-shadow: 0 0 10px rgba(123, 241, 168, 0.65);
      flex-shrink: 0;
    }

    .level-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid var(--border);
    }

    .stat-pill strong {
      color: var(--text);
      font-weight: 700;
    }

    .stat-pill.accent strong {
      color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.85);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: rgba(123, 241, 168, 0.5);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #16a34a;
      border-color: #22c55e;
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #15803d;
      border-color: #4ade80;
    }

    .btn.muted {
      color: var(--text-muted);
      border-color: rgba(148, 163, 184, 0.18);
    }

    .stage-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #game-canvas:active {
      cursor: grabbing;
    }

    .hint-banner {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      max-width: min(92%, 620px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(10, 18, 30, 0.86);
      border: 1px solid rgba(123, 241, 168, 0.32);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      font-size: 13px;
      line-height: 1.45;
      color: #e2e8f0;
      z-index: 10;
    }

    .hint-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .hint-close:hover { color: #ffffff; }

    .legend-bar {
      position: absolute;
      left: 12px;
      top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(10, 18, 30, 0.72);
      border: 1px solid var(--border);
      font-size: 11px;
      color: #cbd5e1;
      pointer-events: none;
      z-index: 8;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-black { background: #1e293b; border: 1.5px solid #94a3b8; }
    .dot-green { background: #40916c; border: 1.5px solid #95d5b2; }
    .dot-pink { background: #ff70a6; border: 1.5px solid #ffc8dd; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(5, 10, 18, 0.72);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      background: #111c2d;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }

    .level-card {
      text-align: left;
      padding: 12px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .level-card:hover {
      background: rgba(51, 65, 85, 0.75);
      border-color: rgba(123, 241, 168, 0.6);
    }

    .level-card.active {
      border-color: var(--accent);
      background: rgba(22, 163, 74, 0.18);
    }

    .level-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .level-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .level-tag {
      font-size: 11px;
      color: #fde047;
      font-weight: 600;
    }

    .level-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .level-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .win-box {
      text-align: center;
    }

    .win-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(123, 241, 168, 0.16);
      border: 1px solid rgba(123, 241, 168, 0.5);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .win-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .win-stats {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .win-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .hidden { display: none !important; }

    @media (max-width: 680px) {
      .topbar { padding: 6px 10px; gap: 6px; }
      .stats-bar { gap: 6px; }
      .stat-pill { padding: 3px 8px; font-size: 11px; }
      .btn { padding: 5px 8px; font-size: 11px; }
      .legend-bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <span class="brand-dot"></span>
        <span class="level-title" id="hud-level-title">第 1 关 · 初遇管道</span>
      </div>

      <div class="stats-bar">
        <span class="stat-pill accent">管道收集 <strong id="hud-collected">0 / 4</strong></span>
        <span class="stat-pill">自由球 <strong id="hud-remaining">14</strong></span>
        <span class="stat-pill">步数 <strong id="hud-moves">0</strong></span>
      </div>

      <div class="controls">
        <button type="button" class="btn" id="btn-levels">关卡</button>
        <button type="button" class="btn" id="btn-undo" title="时间虫撤销 (Z)">撤销</button>
        <button type="button" class="btn" id="btn-restart" title="重开本关 (R)">重开</button>
        <button type="button" class="btn" id="btn-pause" title="暂停/继续 (Space)">暂停</button>
        <button type="button" class="btn" id="btn-mute" title="开关音效 (M)">音效</button>
        <button type="button" class="btn" id="btn-hint">提示</button>
      </div>
    </header>

    <main class="stage-wrap">
      <canvas id="game-canvas"></canvas>

      <div class="legend-bar">
        <div class="legend-item"><span class="dot dot-black"></span>黑球：稳固桁架</div>
        <div class="legend-item"><span class="dot dot-green"></span>绿球：可拆卸复用</div>
        <div class="legend-item"><span class="dot dot-pink"></span>气球：向上浮力</div>
      </div>

      <div class="hint-banner" id="hint-banner">
        <span id="hint-text">拖拽爬行的黏黏球靠近结构即可自动吸附搭建。</span>
        <button type="button" class="hint-close" id="btn-close-hint" aria-label="关闭提示">×</button>
      </div>

      <div class="modal-backdrop hidden" id="overlay-pause">
        <div class="modal-card win-box" style="max-width: 340px;">
          <div class="win-title" style="font-size: 20px;">物理仿真已暂停</div>
          <p class="win-stats" style="margin-bottom: 14px;">快捷键：Z 撤销 · R 重开 · Space 暂停 · M 静音</p>
          <button type="button" class="btn btn-primary" id="btn-resume">继续游戏</button>
        </div>
      </div>

      <div class="modal-backdrop hidden" id="modal-levels">
        <div class="modal-card">
          <div class="modal-header">
            <h2>选择关卡 · 黏黏世界</h2>
            <button type="button" class="btn" id="btn-close-levels">关闭</button>
          </div>
          <div class="level-grid" id="level-grid"></div>
        </div>
      </div>

      <div class="modal-backdrop hidden" id="modal-win">
        <div class="modal-card win-box" style="max-width: 400px;">
          <div class="win-badge" id="win-badge">✓ 关卡完成</div>
          <div class="win-title">管道成功接通！</div>
          <div class="win-stats" id="win-stats"></div>
          <div class="win-actions">
            <button type="button" class="btn" id="btn-win-replay">再玩一次</button>
            <button type="button" class="btn btn-primary" id="btn-win-next">下一关 →</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- BUILD_SCRIPTS_START -->
  <script src="src/engine/math.js"></script>
  <script src="src/engine/physics.js"></script>
  <script src="src/levels/levels.js"></script>
  <script src="src/audio/sound.js"></script>
  <script src="src/engine/game.js"></script>
  <script src="src/ui/renderer.js"></script>
  <script src="src/ui/app.js"></script>
  <!-- BUILD_SCRIPTS_END -->
</body>
</html>
