<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>黏黏世界 · Web World of Goo</title>
  <style>
    :root {
      --bg-dark: #0b1320;
      --surface: rgba(15, 23, 36, 0.88);
      --surface-hover: rgba(30, 41, 59, 0.95);
      --border: rgba(148, 163, 184, 0.22);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #7bf1a8;
      --accent-dark: #15803d;
      --danger: #fb7185;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      z-index: 20;
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #95d5b2, #1b4332);
      box-shadow: 0 0 10px rgba(123, 241, 168, 0.65);
      flex-shrink: 0;
    }

    .level-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid var(--border);
    }

    .stat-pill strong {
      color: var(--text);
      font-weight: 700;
    }

    .stat-pill.accent strong {
      color: var(--accent);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(30, 41, 59, 0.85);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: rgba(123, 241, 168, 0.5);
    }

    .btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #16a34a;
      border-color: #22c55e;
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: #15803d;
      border-color: #4ade80;
    }

    .btn.muted {
      color: var(--text-muted);
      border-color: rgba(148, 163, 184, 0.18);
    }

    .stage-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
      overflow: hidden;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }

    #game-canvas:active {
      cursor: grabbing;
    }

    .hint-banner {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      max-width: min(92%, 620px);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(10, 18, 30, 0.86);
      border: 1px solid rgba(123, 241, 168, 0.32);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      font-size: 13px;
      line-height: 1.45;
      color: #e2e8f0;
      z-index: 10;
    }

    .hint-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
      flex-shrink: 0;
    }

    .hint-close:hover { color: #ffffff; }

    .legend-bar {
      position: absolute;
      left: 12px;
      top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(10, 18, 30, 0.72);
      border: 1px solid var(--border);
      font-size: 11px;
      color: #cbd5e1;
      pointer-events: none;
      z-index: 8;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-black { background: #1e293b; border: 1.5px solid #94a3b8; }
    .dot-green { background: #40916c; border: 1.5px solid #95d5b2; }
    .dot-pink { background: #ff70a6; border: 1.5px solid #ffc8dd; }

    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(5, 10, 18, 0.72);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 30;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      background: #111c2d;
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .level-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
    }

    .level-card {
      text-align: left;
      padding: 12px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .level-card:hover {
      background: rgba(51, 65, 85, 0.75);
      border-color: rgba(123, 241, 168, 0.6);
    }

    .level-card.active {
      border-color: var(--accent);
      background: rgba(22, 163, 74, 0.18);
    }

    .level-card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .level-num {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
    }

    .level-tag {
      font-size: 11px;
      color: #fde047;
      font-weight: 600;
    }

    .level-name {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .level-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .win-box {
      text-align: center;
    }

    .win-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(123, 241, 168, 0.16);
      border: 1px solid rgba(123, 241, 168, 0.5);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .win-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .win-stats {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 18px;
    }

    .win-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .hidden { display: none !important; }

    @media (max-width: 680px) {
      .topbar { padding: 6px 10px; gap: 6px; }
      .stats-bar { gap: 6px; }
      .stat-pill { padding: 3px 8px; font-size: 11px; }
      .btn { padding: 5px 8px; font-size: 11px; }
      .legend-bar { display: none; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <span class="brand-dot"></span>
        <span class="level-title" id="hud-level-title">第 1 关 · 初遇管道</span>
      </div>

      <div class="stats-bar">
        <span class="stat-pill accent">管道收集 <strong id="hud-collected">0 / 4</strong></span>
        <span class="stat-pill">自由球 <strong id="hud-remaining">14</strong></span>
        <span class="stat-pill">步数 <strong id="hud-moves">0</strong></span>
      </div>

      <div class="controls">
        <button type="button" class="btn" id="btn-levels">关卡</button>
        <button type="button" class="btn" id="btn-undo" title="时间虫撤销 (Z)">撤销</button>
        <button type="button" class="btn" id="btn-restart" title="重开本关 (R)">重开</button>
        <button type="button" class="btn" id="btn-pause" title="暂停/继续 (Space)">暂停</button>
        <button type="button" class="btn" id="btn-mute" title="开关音效 (M)">音效</button>
        <button type="button" class="btn" id="btn-hint">提示</button>
      </div>
    </header>

    <main class="stage-wrap">
      <canvas id="game-canvas"></canvas>

      <div class="legend-bar">
        <div class="legend-item"><span class="dot dot-black"></span>黑球：稳固桁架</div>
        <div class="legend-item"><span class="dot dot-green"></span>绿球：可拆卸复用</div>
        <div class="legend-item"><span class="dot dot-pink"></span>气球：向上浮力</div>
      </div>

      <div class="hint-banner" id="hint-banner">
        <span id="hint-text">拖拽爬行的黏黏球靠近结构即可自动吸附搭建。</span>
        <button type="button" class="hint-close" id="btn-close-hint" aria-label="关闭提示">×</button>
      </div>

      <div class="modal-backdrop hidden" id="overlay-pause">
        <div class="modal-card win-box" style="max-width: 340px;">
          <div class="win-title" style="font-size: 20px;">物理仿真已暂停</div>
          <p class="win-stats" style="margin-bottom: 14px;">快捷键：Z 撤销 · R 重开 · Space 暂停 · M 静音</p>
          <button type="button" class="btn btn-primary" id="btn-resume">继续游戏</button>
        </div>
      </div>

      <div class="modal-backdrop hidden" id="modal-levels">
        <div class="modal-card">
          <div class="modal-header">
            <h2>选择关卡 · 黏黏世界</h2>
            <button type="button" class="btn" id="btn-close-levels">关闭</button>
          </div>
          <div class="level-grid" id="level-grid"></div>
        </div>
      </div>

      <div class="modal-backdrop hidden" id="modal-win">
        <div class="modal-card win-box" style="max-width: 400px;">
          <div class="win-badge" id="win-badge">✓ 关卡完成</div>
          <div class="win-title">管道成功接通！</div>
          <div class="win-stats" id="win-stats"></div>
          <div class="win-actions">
            <button type="button" class="btn" id="btn-win-replay">再玩一次</button>
            <button type="button" class="btn btn-primary" id="btn-win-next">下一关 →</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
/* ===== src/engine/math.js ===== */
(function (root, factory) {

})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  function clamp(val, min, max) {
    return val < min ? min : val > max ? max : val;

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function distSq(x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    return dx * dx + dy * dy;
  }

  function dist(x1, y1, x2, y2) {
    return Math.hypot(x2 - x1, y2 - y1);

  function normalize(x, y) {
    const len = Math.hypot(x, y);
    if (len < 1e-8) return { x: 0, y: 0, len: 0 };

   * Project point P(px, py) onto segment AB(x1,y1)-(x2,y2).
   * Returns { x, y, t, dist }.
   */
  function closestPointOnSegment(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = 0;
    if (lenSq > 1e-8) {
      t = clamp(((px - x1) * dx + (py - y1) * dy) / lenSq, 0, 1);
    }
    const cx = x1 + t * dx;
    const cy = y1 + t * dy;
    return { x: cx, y: cy, t, dist: Math.hypot(px - cx, py - cy) };
  }

  /**
   * Check whether segment AB intersects an axis-aligned rectangle (AABB).
   */
  function segmentIntersectsRect(x1, y1, x2, y2, rect) {
    const minX = rect.x;
    const maxX = rect.x + rect.w;
    const minY = rect.y;
    const maxY = rect.y + rect.h;

    let t0 = 0;
    let t1 = 1;
    const dx = x2 - x1;
    const dy = y2 - y1;

    const p = [-dx, dx, -dy, dy];
    const q = [x1 - minX, maxX - x1, y1 - minY, maxY - y1];

    for (let i = 0; i < 4; i++) {
      if (Math.abs(p[i]) < 1e-9) {
        if (q[i] < 0) return false;
      } else {
        const r = q[i] / p[i];
        if (p[i] < 0) {
          if (r > t1) return false;
          if (r > t0) t0 = r;
        } else {
          if (r < t0) return false;
          if (r < t1) t1 = r;
        }

    return t0 <= t1;

  /**
   * Resolve circle (cx, cy, r) against AABB rect {x, y, w, h}.
   * Returns null if no collision, or { nx, ny, penetration, cx, cy }.
   */
  function circleRectCollision(cx, cy, r, rect) {
    const nearestX = clamp(cx, rect.x, rect.x + rect.w);
    const nearestY = clamp(cy, rect.y, rect.y + rect.h);
    const dx = cx - nearestX;
    const dy = cy - nearestY;
    const dSq = dx * dx + dy * dy;

    if (dSq >= r * r) return null;

    if (dSq > 1e-8) {
      const d = Math.sqrt(dSq);
      const nx = dx / d;
      const ny = dy / d;
      const penetration = r - d;
      return { nx, ny, penetration, cx: cx + nx * penetration, cy: cy + ny * penetration };
    }

    // Center is inside the rectangle: push out along shallowest axis
    const left = cx - rect.x;
    const right = rect.x + rect.w - cx;

    const bottom = rect.y + rect.h - cy;

    if (minPen === top) {
      return { nx: 0, ny: -1, penetration: top + r, cx, cy: rect.y - r };
    } else if (minPen === bottom) {
      return { nx: 0, ny: 1, penetration: bottom + r, cx, cy: rect.y + rect.h + r };
    } else if (minPen === left) {
      return { nx: -1, ny: 0, penetration: left + r, cx: rect.x - r, cy };
    }
    return { nx: 1, ny: 0, penetration: right + r, cx: rect.x + rect.w + r, cy };

  return {
    clamp,
    lerp,
    distSq,
    dist,
    normalize,
    closestPointOnSegment,
    segmentIntersectsRect,
    circleRectCollision

  }

      radius: 13,
      mass: 1.0,
      buoyancy: 0,
      minLinks: 2,
      maxLinks: 3,
      detachable: false,
      stiffness: 0.92,
      maxStretch: 1.95
    },
    green: {
      radius: 13,
      mass: 0.92,
      buoyancy: 0,
      minLinks: 2,
      maxLinks: 3,
      detachable: true,
      stiffness: 0.9,
      maxStretch: 2.0
    },
    balloon: {
      radius: 17,
      mass: 0.45,
      buoyancy: 980,
      minLinks: 1,
      maxLinks: 1,
      detachable: true,
      stiffness: 0.72,
      maxStretch: 2.35
    }
  };

  class PhysicsWorld {
    constructor(options = {}) {

      this.height = options.height || 660;
      this.gravity = options.gravity !== undefined ? options.gravity : 540;
      this.damping = options.damping !== undefined ? options.damping : 0.992;
      this.iterations = options.iterations || 14;
      this.windBase = options.wind || 0;
      this.windGust = options.windGust || 0;
      this.time = 0;

      this.nodes = [];
      this.strands = [];
      this.platforms = [];
      this.nextNodeId = 1;
      this.nextStrandId = 1;

      this.onStrandBreak = options.onStrandBreak || null;
      this.onNodeHazard = options.onNodeHazard || null;
    }

    getCurrentWind() {
      if (!this.windBase && !this.windGust) return 0;
      return this.windBase + Math.sin(this.time * 1.15) * this.windGust;
    }

    addPlatform(p) {
      this.platforms.push({
        x: p.x,
        y: p.y,
        w: p.w,
        h: p.h,
        type: p.type || 'ground' // 'ground' | 'hazard' | 'sticky'
      });
    }

    addNode(cfg) {
      const type = cfg.type || 'black';
      const spec = BALL_SPECS[type] || BALL_SPECS.black;
      const node = {
        id: cfg.id || this.nextNodeId++,
        x: cfg.x,
        y: cfg.y,
        oldX: cfg.oldX !== undefined ? cfg.oldX : cfg.x,
        oldY: cfg.oldY !== undefined ? cfg.oldY : cfg.y,
        radius: cfg.radius || spec.radius,
        mass: cfg.mass !== undefined ? cfg.mass : spec.mass,
        buoyancy: cfg.buoyancy !== undefined ? cfg.buoyancy : spec.buoyancy,
        type,
        pinned: Boolean(cfg.pinned),
        state: cfg.state || 'structural', // 'structural' | 'walker' | 'dragging' | 'sucked' | 'collected' | 'dead'
        grounded: false,

        const vx = (n.x - n.oldX) * this.damping;
        const vy = (n.y - n.oldY) * this.damping;

        n.oldX = n.x;
        n.oldY = n.y;

        const ax = wind / Math.max(0.25, n.mass);
        const ay = this.gravity - (n.buoyancy / Math.max(0.25, n.mass));

        n.x += vx + ax * dtSq;
        n.y += vy + ay * dtSq;
        n.grounded = false;

    }

    }

        levelName: this.level.name,
        subtitle: this.level.subtitle,
        hint: this.level.hint,

    ATTACH_MIN_DIST,
    ATTACH_MAX_DIST,
    PICK_RADIUS,

      ctx.arc(drag.x, drag.y, drag.radius + 9, 0, Math.PI * 2);
      ctx.strokeStyle = valid ? 'rgba(123, 241, 168, 0.8)' : 'rgba(248, 113, 113, 0.65)';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }

    _drawStrands(ctx) {
      const world = this.game.world;
      for (const s of world.strands) {
        if (s.broken) continue;
        const a = world.getNodeById(s.a);
        const b = world.getNodeById(s.b);
        if (!a || !b || a.state !== 'structural' || b.state !== 'structural') continue;

        ctx.save();
        if (s.isBalloonLink) {
          // Thin flexible balloon string
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = '#ffd6e7';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else {
          // Organic goo truss strand: thins slightly and glows red-orange under high stress
          const stress = Math.min(1, s.stress);
          const thickness = Math.max(2.6, 6.2 - stress * 2.8);

          // Color blend from dark ink/green to warning crimson
          const isGreen = a.type === 'green' || b.type === 'green';
          let strokeColor = isGreen ? '#2d6a4f' : '#1b262c';
          if (stress > 0.45) {
            const t = (stress - 0.45) / 0.55;
            const r = Math.round(45 + t * 210);
            const g = Math.round(106 - t * 65);
            const bl = Math.round(79 - t * 50);
            strokeColor = `rgb(${r},${g},${bl})`;
          }

          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.lineCap = 'round';
          ctx.strokeStyle = strokeColor;
          ctx.lineWidth = thickness + 2;
          ctx.stroke();

          // Glossy inner core
          ctx.strokeStyle = isGreen ? '#52b788' : '#3d5a6c';
          ctx.lineWidth = Math.max(1.2, thickness * 0.42);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    _drawNodes(ctx, level) {
      const nodes = this.game.world.nodes;
      const lookTarget = this.game.draggingNode
        ? { x: this.game.draggingNode.x, y: this.game.draggingNode.y }
        : this.game.pipeActive
          ? level.pipe
          : this.game.pointer;

      // Draw structural first, then walkers, then dragging on top
      const order = { structural: 1, walker: 2, sucked: 3, dragging: 4 };
      const visible = nodes
        .filter(n => n.state !== 'collected' && n.state !== 'dead')
        .sort((a, b) => (order[a.state] || 0) - (order[b.state] || 0));

      for (const n of visible) {
        ctx.save();
        ctx.translate(n.x, n.y);
        ctx.scale(n.scaleX, n.scaleY);

        const r = n.state === 'walker' ? n.radius * 0.86 : n.radius;

        if (n.type === 'balloon') {
          this._drawBalloonBody(ctx, r);
        } else {
          this._drawGooBody(ctx, n, r, lookTarget);
        }

        // Pin indicator for terrain anchors
        if (n.pinned) {
          ctx.beginPath();
          ctx.arc(0, r * 0.65, 3.2, 0, Math.PI * 2);
          ctx.fillStyle = '#94a3b8';
          ctx.fill();
        }

        ctx.restore();
      }
    }

    _drawBalloonBody(ctx, r) {
      const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, 2, 0, 0, r * 1.1);
      grad.addColorStop(0, '#ffc8dd');
      grad.addColorStop(0.55, '#ff70a6');
      grad.addColorStop(1, '#c9184a');

      ctx.beginPath();
      ctx.ellipse(0, 0, r * 0.92, r * 1.08, 0, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = '#ff99c8';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Gloss highlight
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.beginPath();
      ctx.ellipse(-r * 0.32, -r * 0.35, r * 0.22, r * 0.34, -0.5, 0, Math.PI * 2);
      ctx.fill();

      // Balloon knot
      ctx.fillStyle = '#c9184a';
      ctx.beginPath();
      ctx.moveTo(-4, r * 1.02);
      ctx.lineTo(4, r * 1.02);
      ctx.lineTo(0, r * 1.28);
      ctx.closePath();
      ctx.fill();
    }

    _drawGooBody(ctx, n, r, lookTarget) {
      const isGreen = n.type === 'green';
      const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.35, 1.5, 0, 0, r);
      if (isGreen) {
        grad.addColorStop(0, '#95d5b2');
        grad.addColorStop(0.55, '#40916c');
        grad.addColorStop(1, '#1b4332');
      } else {
        grad.addColorStop(0, '#4a5568');
        grad.addColorStop(0.55, '#1a202c');
        grad.addColorStop(1, '#090d12');
      }

      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Subtle rim for green detachable balls
      if (isGreen) {
        ctx.strokeStyle = 'rgba(149, 213, 178, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      } else if (n.state === 'walker') {
        ctx.strokeStyle = 'rgba(168, 218, 220, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }

      // Expressive blinking eyes
      const blinking = n.blinkTimer < 0;
      const eyeOffsetX = r * 0.33;
      const eyeY = -r * 0.1;
      const eyeR = r * 0.3;

      if (blinking) {
        ctx.strokeStyle = '#e2e8f0';
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-eyeOffsetX - eyeR * 0.7, eyeY);
        ctx.lineTo(-eyeOffsetX + eyeR * 0.7, eyeY);
        ctx.moveTo(eyeOffsetX - eyeR * 0.7, eyeY);
        ctx.lineTo(eyeOffsetX + eyeR * 0.7, eyeY);
        ctx.stroke();
      } else {
        const dx = lookTarget.x - n.x;
        const dy = lookTarget.y - n.y;
        const ang = Math.atan2(dy, dx);
        const pupilShift = eyeR * 0.36;
        const px = Math.cos(ang) * pupilShift;
        const py = Math.sin(ang) * pupilShift;

        for (const side of [-1, 1]) {
          const ex = side * eyeOffsetX;
          ctx.beginPath();
          ctx.arc(ex, eyeY, eyeR, 0, Math.PI * 2);
          ctx.fillStyle = '#f8fafc';
          ctx.fill();

          ctx.beginPath();
          ctx.arc(ex + px, eyeY + py, eyeR * 0.48, 0, Math.PI * 2);
          ctx.fillStyle = '#0f172a';
          ctx.fill();
        }
      }
    }

    _drawParticles(ctx) {
      for (const p of this.game.particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  return { CanvasRenderer };
});


/* ===== src/ui/app.js ===== */
(function (root) {
  'use strict';

  function initApp() {
    const canvas = document.getElementById('game-canvas');
    if (!canvas) return;

    const sound = new root.GooSound.SoundEngine();
    let game = null;
    let renderer = null;
    let rafId = null;
    let lastTime = 0;

    // Load saved progress safely
    let savedProgress = {};
    try {
      const raw = localStorage.getItem('web_world_of_goo_progress');
      if (raw) savedProgress = JSON.parse(raw);
    } catch (e) {
      savedProgress = {};
    }

    // DOM refs
    const elLevelTitle = document.getElementById('hud-level-title');
    const elCollected = document.getElementById('hud-collected');
    const elRemaining = document.getElementById('hud-remaining');
    const elMoves = document.getElementById('hud-moves');
    const elHintText = document.getElementById('hint-text');
    const elHintBanner = document.getElementById('hint-banner');

    const btnLevels = document.getElementById('btn-levels');
    const btnUndo = document.getElementById('btn-undo');
    const btnRestart = document.getElementById('btn-restart');
    const btnPause = document.getElementById('btn-pause');
    const btnMute = document.getElementById('btn-mute');
    const btnHint = document.getElementById('btn-hint');
    const btnCloseHint = document.getElementById('btn-close-hint');

    const modalLevels = document.getElementById('modal-levels');
    const levelGrid = document.getElementById('level-grid');
    const btnCloseLevels = document.getElementById('btn-close-levels');

    const modalWin = document.getElementById('modal-win');
    const winStats = document.getElementById('win-stats');
    const winBadge = document.getElementById('win-badge');
    const btnWinReplay = document.getElementById('btn-win-replay');
    const btnWinNext = document.getElementById('btn-win-next');

    const overlayPause = document.getElementById('overlay-pause');
    const btnResume = document.getElementById('btn-resume');

    function persistProgress(completedLevels) {
      try {
        localStorage.setItem('web_world_of_goo_progress', JSON.stringify(completedLevels));
      } catch (e) {
        // Ignore storage errors in sandboxed iframes
      }
    }

    function renderLevelCards(state) {
      levelGrid.innerHTML = '';
      for (const lvl of root.GooLevels.LEVELS) {
        const done = state.completedLevels[lvl.id];
        const isCurrent = lvl.id === state.levelId;
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'level-card' + (isCurrent ? ' active' : '') + (done ? ' completed' : '');
        card.innerHTML =
          '<div class="level-card-head">' +
            '<span class="level-num">第 ' + lvl.id + ' 关</span>' +
            (done ? '<span class="level-tag">' + (done.ocd ? '★ OCD 完美' : '✓ 已通关') + '</span>' : '') +
          '</div>' +
          '<div class="level-name">' + lvl.name + '</div>' +
          '<div class="level-sub">' + lvl.subtitle + '</div>';
        card.addEventListener('click', function () {
          modalLevels.classList.add('hidden');
          game.loadLevel(lvl.id);
          renderer.resize();
        });
        levelGrid.appendChild(card);
      }
    }

    function updateHUD(state) {
      elLevelTitle.textContent = '第 ' + state.levelId + ' 关 · ' + state.levelName;
      elCollected.textContent = state.collectedCount + ' / ' + state.targetCount;
      elRemaining.textContent = String(state.remainingWalkers);
      elMoves.textContent = String(state.movesCount);
      elHintText.textContent = state.hint;

      btnUndo.disabled = !state.canUndo;
      btnPause.textContent = state.status === 'paused' ? '继续' : '暂停';

      if (state.status === 'paused') {
        overlayPause.classList.remove('hidden');
      } else {
        overlayPause.classList.add('hidden');
      }

      if (state.status === 'won') {
        persistProgress(state.completedLevels);
        const isOcd = state.collectedCount >= state.ocdTarget;
        winBadge.textContent = isOcd ? '★ OCD 大师通关' : '✓ 关卡完成';
        winStats.textContent =
          '已收集 ' + state.collectedCount + ' 颗黏黏球（目标 ' + state.targetCount +
          ' 颗）· 共搭建 ' + state.movesCount + ' 步';
        btnWinNext.textContent =
          state.levelId < state.totalLevels ? '下一关 →' : '回到第 1 关';
        modalWin.classList.remove('hidden');
      } else {
        modalWin.classList.add('hidden');
      }

      renderLevelCards(state);
    }

    game = new root.GooGame.GooGameEngine({
      levelId: 1,
      sound: sound,
      onStateChange: updateHUD
    });
    game.completedLevels = { ...savedProgress };
    renderer = new root.GooRenderer.CanvasRenderer(canvas, game);

    function handleResize() {
      renderer.resize();
      renderer.render(0);
    }

    window.addEventListener('resize', handleResize);
    handleResize();
    updateHUD(game.getHUDState());

    // Pointer & touch interaction
    function getWorldPos(e) {
      return renderer.screenToWorld(e.clientX, e.clientY);
    }

    canvas.addEventListener('pointerdown', function (e) {
      sound.unlock();
      if (e.button !== undefined && e.button !== 0) return;
      canvas.setPointerCapture(e.pointerId);
      const pos = getWorldPos(e);
      game.pointerDown(pos.x, pos.y);
    });

    canvas.addEventListener('pointermove', function (e) {
      const pos = getWorldPos(e);
      game.pointerMove(pos.x, pos.y);
    });

    function endDrag(e) {
      const pos = getWorldPos(e);
      game.pointerUp(pos.x, pos.y);
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    // Toolbar controls
    btnLevels.addEventListener('click', function () {
      sound.unlock();
      renderLevelCards(game.getHUDState());
      modalLevels.classList.remove('hidden');
    });

    btnCloseLevels.addEventListener('click', function () {
      modalLevels.classList.add('hidden');
    });

    modalLevels.addEventListener('click', function (e) {
      if (e.target === modalLevels) modalLevels.classList.add('hidden');
    });

    btnUndo.addEventListener('click', function () {
      sound.unlock();
      game.undo();
    });

    btnRestart.addEventListener('click', function () {
      sound.unlock();
      game.restartLevel();
    });

    btnPause.addEventListener('click', function () {
      sound.unlock();
      game.togglePause();
    });

    btnResume.addEventListener('click', function () {
      sound.unlock();
      game.togglePause();
    });

    btnMute.addEventListener('click', function () {
      const muted = sound.toggleMute();
      btnMute.textContent = muted ? '静音' : '音效';
      btnMute.classList.toggle('muted', muted);
    });

    btnHint.addEventListener('click', function () {
      elHintBanner.classList.toggle('hidden');
    });

    btnCloseHint.addEventListener('click', function () {
      elHintBanner.classList.add('hidden');
    });

    btnWinReplay.addEventListener('click', function () {
      sound.unlock();
      game.restartLevel();
    });

    btnWinNext.addEventListener('click', function () {
      sound.unlock();
      const nextId = game.currentLevelId < root.GooLevels.LEVELS.length ? game.currentLevelId + 1 : 1;
      game.loadLevel(nextId);
      renderer.resize();
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', function (e) {
      if (e.key === 'z' || e.key === 'Z') {
        game.undo();
      } else if (e.key === 'r' || e.key === 'R') {
        game.restartLevel();
      } else if (e.key === ' ') {
        e.preventDefault();
        game.togglePause();
      } else if (e.key === 'm' || e.key === 'M') {
        const muted = sound.toggleMute();
        btnMute.textContent = muted ? '静音' : '音效';
        btnMute.classList.toggle('muted', muted);
      } else if (e.key === 'Escape') {
        modalLevels.classList.add('hidden');
      }
    });

    // Main animation loop
    function loop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      game.update(dt);
      renderer.render(dt);
      rafId = requestAnimationFrame(loop);
    }

    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  window.onload = initApp;
})(typeof globalThis !== 'undefined' ? globalThis : window);

  </script>
</body>
</html>
