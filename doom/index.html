<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOOM-JS // Phobos Sector (2.5D Web Raycaster)</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #141821;
      --border: #2a3142;
      --accent: #dc2626;
      --accent-glow: #ef4444;
      --gold: #facc15;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #1b1318 0%, var(--bg) 65%);
      color: var(--text);
      font-family: 'Inter', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      user-select: none;
      -webkit-user-select: none;
    }
    .shell {
      width: 100%;
      max-width: 980px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      font-size: 14px;
      color: var(--gold);
    }
    .brand-badge {
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .btn {
      background: #1f2633;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 11px;
      font-size: 11px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.08s;
    }
    .btn:hover { background: #2c3547; border-color: #475569; }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: linear-gradient(180deg, #ef4444, #b91c1c);
      border-color: #f87171;
      color: #fff;
      font-size: 13px;
      padding: 10px 22px;
      letter-spacing: 0.08em;
      box-shadow: 0 0 18px rgba(220, 38, 38, 0.35);
    }
    .btn-primary:hover { background: linear-gradient(180deg, #f87171, #dc2626); }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border: 2px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
    }
    #game-canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 9, 14, 0.84);
      backdrop-filter: blur(3px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      gap: 12px;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay h1 {
      font-size: clamp(22px, 4vw, 38px);
      color: var(--accent-glow);
      letter-spacing: 0.12em;
      text-shadow: 0 2px 14px rgba(239, 68, 68, 0.5);
    }
    .overlay p {
      max-width: 560px;
      color: #cbd5e1;
      font-size: clamp(12px, 1.8vw, 14px);
      line-height: 1.55;
    }
    .overlay-stats {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }
    .overlay-actions {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
    }
    .key-hints {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
    }
    .key-hints span strong {
      color: var(--text);
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 1px 5px;
      margin-right: 4px;
    }
    .touch-pad {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .touch-btn {
      min-width: 42px;
      height: 36px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      font-weight: 700;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      touch-action: none;
    }
    .touch-btn:active { background: #334155; }
    .touch-btn.fire {
      background: #991b1b;
      border-color: #ef4444;
      padding: 0 12px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-badge">WEB-DOOM</span>
        <span>PHOBOS SECTOR // 2.5D RAYCASTER</span>
      </div>
      <div class="toolbar">
        <button id="btn-map" class="btn" type="button">MAP: ON</button>
        <button id="btn-mute" class="btn" type="button">AUDIO: ON</button>
        <button id="btn-pause" class="btn" type="button">PAUSE</button>
        <button id="btn-restart" class="btn" type="button">RESTART</button>
      </div>
    </header>

    <main class="stage">
      <canvas id="game-canvas" width="480" height="270" aria-label="Web DOOM Game Viewport"></canvas>
      <div id="overlay" class="overlay">
        <h1 id="overlay-title">DOOM-JS // PHOBOS SECTOR</h1>
        <p id="overlay-desc">2.5D DDA Raycasting Engine. WASD move, Mouse/Arrows turn, Click/Space fire, E open doors &amp; switches, 1-4 weapons.</p>
        <div id="overlay-stats" class="overlay-stats"></div>
        <div class="overlay-actions">
          <button id="overlay-primary-btn" class="btn btn-primary" type="button">START MISSION</button>
          <button id="overlay-secondary-btn" class="btn hidden" type="button">RESTART</button>
        </div>
      </div>
    </main>

    <footer class="controls-bar">
      <div class="key-hints">
        <span><strong>WASD</strong>Move</span>
        <span><strong>Mouse / ←→</strong>Turn</span>
        <span><strong>Click / Space</strong>Fire</span>
        <span><strong>E</strong>Door / Exit</span>
        <span><strong>1-4</strong>Weapon</span>
        <span><strong>M</strong>Map</span>
        <span><strong>P</strong>Pause</span>
      </div>
      <div class="touch-pad" aria-label="On-screen controls">
        <button id="ctrl-left" class="touch-btn" type="button" title="Turn Left">⟲</button>
        <button id="ctrl-fwd" class="touch-btn" type="button" title="Move Forward">▲</button>
        <button id="ctrl-back" class="touch-btn" type="button" title="Move Back">▼</button>
        <button id="ctrl-right" class="touch-btn" type="button" title="Turn Right">⟳</button>
        <button id="ctrl-use" class="touch-btn" type="button" title="Interact / Door">USE</button>
        <button id="ctrl-weap" class="touch-btn" type="button" title="Cycle Weapon">WPN</button>
        <button id="ctrl-fire" class="touch-btn fire" type="button" title="Fire Weapon">FIRE</button>
      </div>
    </footer>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
