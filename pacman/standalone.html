<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON PAC-ARCADE · 经典街机吃豆人复刻版</title>
  <style>
:root {
  --bg-deep: #050814;
  --bg-panel: #0d1326;
  --border-neon: #2563eb;
  --accent-gold: #facc15;
  --accent-cyan: #38bdf8;
  --accent-pink: #f472b6;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(circle at top, #111c3a 0%, var(--bg-deep) 68%);
  color: var(--text-main);
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px 12px 28px;
}

.arcade-shell {
  width: 100%;
  max-width: 920px;
  background: linear-gradient(180deg, #11182d 0%, #090e1d 100%);
  border: 2px solid rgba(56, 189, 248, 0.35);
  border-radius: 18px;
  box-shadow: 0 20px 55px rgba(0, 0, 0, 0.65), 0 0 24px rgba(37, 99, 235, 0.2);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.marquee-header {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(148, 163, 184, 0.18);
}

.marquee-title {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.marquee-title h1 {
  font-family: "Courier New", monospace;
  font-size: clamp(1.2rem, 2.5vw, 1.65rem);
  letter-spacing: 0.08em;
  color: var(--accent-gold);
  text-shadow: 0 0 12px rgba(250, 204, 21, 0.45);
}

.marquee-title p {
  font-size: 0.82rem;
  color: var(--text-muted);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  appearance: none;
  border: 1px solid rgba(56, 189, 248, 0.4);
  background: rgba(15, 23, 42, 0.9);
  color: var(--text-main);
  font-size: 0.82rem;
  font-weight: 600;
  padding: 7px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
}

.btn:hover:not(:disabled) {
  background: rgba(37, 99, 235, 0.28);
  border-color: var(--accent-cyan);
  transform: translateY(-1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.btn-primary {
  background: linear-gradient(135deg, #facc15, #f59e0b);
  color: #0f172a;
  border-color: #fde047;
}

.btn-primary:hover:not(:disabled) {
  background: linear-gradient(135deg, #fde047, #fbbf24);
  border-color: #fef08a;
}

.cabinet-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 235px;
  gap: 16px;
  align-items: start;
}

.screen-bezel {
  position: relative;
  background: #02040a;
  border: 3px solid #1e293b;
  border-radius: 14px;
  padding: 10px;
  box-shadow: inset 0 0 28px rgba(37, 99, 235, 0.25);
  overflow: hidden;
}

.screen-bezel canvas {
  display: block;
  width: 100%;
  height: auto;
  max-width: 560px;
  margin: 0 auto;
  border-radius: 8px;
  image-rendering: pixelated;
  touch-action: none;
}

.screen-bezel.crt-enabled::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.03) 0px,
    rgba(255, 255, 255, 0.03) 1px,
    rgba(0, 0, 0, 0.22) 2px,
    rgba(0, 0, 0, 0.22) 4px
  );
  border-radius: 12px;
}

.side-panel {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.hud-card {
  background: var(--bg-panel);
  border: 1px solid rgba(148, 163, 184, 0.16);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.hud-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat-box {
  background: rgba(2, 6, 23, 0.65);
  border-radius: 8px;
  padding: 8px;
}

.stat-label {
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 3px;
}

.stat-value {
  font-family: "Courier New", monospace;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-main);
}

.stat-value.gold {
  color: var(--accent-gold);
}

.stat-value.cyan {
  color: var(--accent-cyan);
}

.stat-value[data-mode="fright"] {
  color: #60a5fa;
}

.stat-value[data-mode="chase"] {
  color: #fb7185;
}

.stat-value[data-mode="scatter"] {
  color: #4ade80;
}

.ghost-legend {
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.78rem;
  color: #cbd5e1;
}

.ghost-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.dpad-card {
  background: var(--bg-panel);
  border: 1px solid rgba(148, 163, 184, 0.16);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.dpad-grid {
  display: grid;
  grid-template-columns: repeat(3, 46px);
  grid-template-rows: repeat(3, 42px);
  gap: 6px;
}

.dpad-btn {
  border: 1px solid rgba(56, 189, 248, 0.35);
  background: #172554;
  color: #f8fafc;
  font-size: 1.05rem;
  font-weight: 700;
  border-radius: 10px;
  cursor: pointer;
  user-select: none;
  touch-action: manipulation;
}

.dpad-btn:active {
  background: #2563eb;
  transform: scale(0.95);
}

.dpad-up { grid-column: 2; grid-row: 1; }
.dpad-left { grid-column: 1; grid-row: 2; }
.dpad-right { grid-column: 3; grid-row: 2; }
.dpad-down { grid-column: 2; grid-row: 3; }

.hint-text {
  font-size: 0.74rem;
  color: var(--text-muted);
  text-align: center;
  line-height: 1.45;
}

@media (max-width: 780px) {
  .cabinet-body {
    grid-template-columns: 1fr;
  }

  .side-panel {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 520px) {
  .side-panel {
    grid-template-columns: 1fr;
  }
}

  </style>

    <header class="marquee-header">

            <div class="ghost-row"><span class="dot" style="background:#ff85d0"></span><strong>PINKY</strong> · 前方4格伏击</div>
            <div class="ghost-row"><span class="dot" style="background:#00f5d4"></span><strong>INKY</strong> · 双倍向量包抄</div>
            <div class="ghost-row"><span class="dot" style="background:#ff9e00"></span><strong>CLYDE</strong> · 8格阈值游走</div>

        </div>

    </section>
  </main>

  <script>
(function () {
'use strict';

// ===== src/constants.js =====
/**
 * 经典街机《吃豆人》核心常量与关卡配置
 */

const TILE_SIZE = 20;
const MAZE_COLS = 28;
const MAZE_ROWS = 31;
const CANVAS_WIDTH = MAZE_COLS * TILE_SIZE;   // 560
const CANVAS_HEIGHT = MAZE_ROWS * TILE_SIZE;  // 620

const TILE = Object.freeze({
  EMPTY: 0,
  WALL: 1,
  PELLET: 2,
  POWER: 3,
  GHOST_GATE: 4,
  GHOST_HOUSE: 5,
  TUNNEL: 6,
});

const DIR = Object.freeze({
  NONE: { name: 'NONE', x: 0, y: 0 },
  UP: { name: 'UP', x: 0, y: -1 },
  DOWN: { name: 'DOWN', x: 0, y: 1 },
  LEFT: { name: 'LEFT', x: -1, y: 0 },
  RIGHT: { name: 'RIGHT', x: 1, y: 0 },
});

const CARDINAL_DIRS = Object.freeze([DIR.UP, DIR.LEFT, DIR.DOWN, DIR.RIGHT]);

const OPPOSITE_DIR = Object.freeze({
  UP: DIR.DOWN,
  DOWN: DIR.UP,
  LEFT: DIR.RIGHT,
  RIGHT: DIR.LEFT,
  NONE: DIR.NONE,
});

const GAME_STATE = Object.freeze({
  TITLE: 'TITLE',
  READY: 'READY',
  PLAYING: 'PLAYING',
  PAUSED: 'PAUSED',
  DYING: 'DYING',
  LEVEL_CLEAR: 'LEVEL_CLEAR',
  GAME_OVER: 'GAME_OVER',
});

const GHOST_MODE = Object.freeze({
  SCATTER: 'SCATTER',
  CHASE: 'CHASE',
  FRIGHTENED: 'FRIGHTENED',
  EATEN: 'EATEN',
  HOUSE: 'HOUSE',
});

const SCORE = Object.freeze({
  PELLET: 10,
  POWER_PELLET: 50,
  GHOST_BASE: 200,
  EXTRA_LIFE_THRESHOLD: 10000,
});

const FRUIT_TABLE = Object.freeze([
  { name: 'Cherry', label: '樱桃', color: '#ff2e63', points: 100 },
  { name: 'Strawberry', label: '草莓', color: '#ff4d6d', points: 300 },
  { name: 'Orange', label: '橙子', color: '#ff9f1c', points: 500 },
  { name: 'Apple', label: '苹果', color: '#ff3b30', points: 700 },
  { name: 'Melon', label: '甜瓜', color: '#2ec4b6', points: 1000 },
  { name: 'Galaxian', label: '旗舰', color: '#ffd166', points: 2000 },
  { name: 'Bell', label: '金钟', color: '#ffe66d', points: 3000 },
  { name: 'Key', label: '钥匙', color: '#4cc9f0', points: 5000 },
]);

const GHOST_CONFIGS = Object.freeze([
  {
    id: 'blinky',
    name: 'BLINKY',
    cnName: '追击红影',
    color: '#ff2a54',
    startTile: { col: 13.5, row: 11 },
    scatterTarget: { col: 25, row: -2 },
    releaseDelay: 0,
    startInHouse: false,
  },
  {
    id: 'pinky',
    name: 'PINKY',
    cnName: '伏击粉影',
    color: '#ff85d0',
    startTile: { col: 13.5, row: 14 },
    scatterTarget: { col: 2, row: -2 },
    releaseDelay: 1.5,
    startInHouse: true,
  },
  {
    id: 'inky',
    name: 'INKY',
    cnName: '包抄青影',
    color: '#00f5d4',
    startTile: { col: 11.5, row: 14 },
    scatterTarget: { col: 27, row: 32 },
    releaseDelay: 4.5,
    startInHouse: true,
  },
  {
    id: 'clyde',
    name: 'CLYDE',
    cnName: '游走橙影',
    color: '#ff9e00',
    startTile: { col: 15.5, row: 14 },
    scatterTarget: { col: 0, row: 32 },
    releaseDelay: 8.0,
    startInHouse: true,
  },
]);

const PACMAN_START = Object.freeze({ col: 13.5, row: 23 });
const GHOST_HOUSE_EXIT = Object.freeze({ col: 13.5, row: 11 });
const GHOST_HOUSE_CENTER = Object.freeze({ col: 13.5, row: 14 });
const FRUIT_SPAWN = Object.freeze({ col: 13.5, row: 17 });
const TUNNEL_ROW = 14;

/**
 * 根据关卡号返回速度与恐惧时长参数（单位：格/秒、秒）
 */
function getLevelConfig(level) {
  const lv = Math.max(1, Math.floor(level));
  const fruit = FRUIT_TABLE[Math.min(lv - 1, FRUIT_TABLE.length - 1)];
  return {
    level: lv,
    pacmanSpeed: Math.min(8.2, 6.2 + (lv - 1) * 0.25),
    ghostSpeed: Math.min(7.9, 5.6 + (lv - 1) * 0.28),
    frightenedSpeed: Math.min(4.8, 3.4 + (lv - 1) * 0.15),
    tunnelSpeed: 3.1,
    eatenSpeed: 11.5,
    frightenedDuration: Math.max(2.0, 7.0 - (lv - 1) * 0.7),
    waveSchedule: lv === 1
      ? [
          { mode: GHOST_MODE.SCATTER, duration: 7 },
          { mode: GHOST_MODE.CHASE, duration: 20 },
          { mode: GHOST_MODE.SCATTER, duration: 7 },
          { mode: GHOST_MODE.CHASE, duration: 20 },
          { mode: GHOST_MODE.SCATTER, duration: 5 },
          { mode: GHOST_MODE.CHASE, duration: Infinity },
        ]
      : [
          { mode: GHOST_MODE.SCATTER, duration: 5 },
          { mode: GHOST_MODE.CHASE, duration: 20 },
          { mode: GHOST_MODE.SCATTER, duration: 5 },
          { mode: GHOST_MODE.CHASE, duration: 20 },
          { mode: GHOST_MODE.SCATTER, duration: 4 },
          { mode: GHOST_MODE.CHASE, duration: Infinity },
        ],
    fruit,
  };
}

// ===== src/maze.js =====
/**
 * 经典 28x31 街机迷宫地图与网格导航工具
 * 字符映射：
 *  '#' = 墙壁 (WALL)
 *  '.' = 普通豆子 (PELLET)
 *  'o' = 能量豆 (POWER)
 *  '-' = 幽灵屋闸门 (GHOST_GATE)
 *  'H' = 幽灵屋内部 (GHOST_HOUSE)
 *  'T' = 穿越隧道 (TUNNEL)
 *  ' ' = 空地 (EMPTY)
 */

const RAW_MAZE_TEMPLATE = Object.freeze([
  '############################',
  '#............##............#',
  '#.####.#####.##.#####.####.#',
  '#o####.#####.##.#####.####o#',
  '#.####.#####.##.#####.####.#',
  '#..........................#',
  '#.####.##.########.##.####.#',
  '#.####.##.########.##.####.#',
  '#......##....##....##......#',
  '######.##### ## #####.######',
  '     #.##### ## #####.#     ',
  '     #.##          ##.#     ',
  '     #.## ###--### ##.#     ',
  '######.## #HHHHHH# ##.######',
  'TTTTTT.   #HHHHHH#   .TTTTTT',
  '######.## #HHHHHH# ##.######',
  '     #.## ######## ##.#     ',
  '     #.##          ##.#     ',
  '     #.## ######## ##.#     ',
  '######.## ######## ##.######',
  '#............##............#',
  '#.####.#####.##.#####.####.#',
  '#.####.#####.##.#####.####.#',
  '#o..##.......  .......##..o#',
  '###.##.##.########.##.##.###',
  '###.##.##.########.##.##.###',
  '#......##....##....##......#',
  '#.##########.##.##########.#',
  '#.##########.##.##########.#',
  '#..........................#',
  '############################',
]);

const CHAR_TO_TILE = Object.freeze({
  '#': TILE.WALL,
  '.': TILE.PELLET,
  o: TILE.POWER,
  '-': TILE.GHOST_GATE,
  H: TILE.GHOST_HOUSE,
  T: TILE.TUNNEL,
  ' ': TILE.EMPTY,
});

class Maze {
  constructor(template = RAW_MAZE_TEMPLATE) {
    this.template = template;
    this.cols = MAZE_COLS;
    this.rows = MAZE_ROWS;
    this.grid = [];
    this.totalPellets = 0;
    this.remainingPellets = 0;
    this.reset();
  }

  reset() {
    if (this.template.length !== this.rows) {
      throw new Error(`Invalid maze row count: expected ${this.rows}, got ${this.template.length}`);
    }
    this.grid = [];
    this.totalPellets = 0;
    for (let r = 0; r < this.rows; r++) {
      const line = this.template[r];
      if (line.length !== this.cols) {
        throw new Error(`Invalid maze col count at row ${r}: expected ${this.cols}, got ${line.length}`);
      }
      const rowArr = new Array(this.cols);
      for (let c = 0; c < this.cols; c++) {
        const ch = line[c];
        const tile = CHAR_TO_TILE[ch];
        if (tile === undefined) {
          throw new Error(`Unknown maze tile char "${ch}" at (${c}, ${r})`);
        }
        rowArr[c] = tile;
        if (tile === TILE.PELLET || tile === TILE.POWER) {
          this.totalPellets++;
        }
      }
      this.grid.push(rowArr);
    }
    this.remainingPellets = this.totalPellets;
  }

  wrapCol(col) {
    return ((col % this.cols) + this.cols) % this.cols;
  }

  getTile(col, row) {
    if (row < 0 || row >= this.rows) return TILE.WALL;
    const wrappedCol = this.wrapCol(col);
    return this.grid[row][wrappedCol];
  }

  isWall(col, row) {
    return this.getTile(col, row) === TILE.WALL;
  }

  isTunnel(col, row) {
    if (row < 0 || row >= this.rows) return false;
    if (col < 0 || col >= this.cols) return row === 14;
    return this.grid[row][col] === TILE.TUNNEL;
  }

  /**
   * 判断某格是否可通行
   * @param {number} col
   * @param {number} row
   * @param {boolean} canPassGate 幽灵离开/返回幽灵屋时可通过闸门
   */
  isWalkable(col, row, canPassGate = false) {
    if (row < 0 || row >= this.rows) return false;
    const wrappedCol = this.wrapCol(col);
    const t = this.grid[row][wrappedCol];
    if (t === TILE.WALL) return false;
    if (t === TILE.GHOST_GATE || t === TILE.GHOST_HOUSE) {
      return canPassGate;
    }
    return true;
  }

  /**
   * 吃掉指定格子的豆子或能量豆
   * @returns {number} 吃掉的瓦片类型 (TILE.PELLET / TILE.POWER / TILE.EMPTY)
   */
  consumePellet(col, row) {
    if (row < 0 || row >= this.rows) return TILE.EMPTY;
    const wrappedCol = this.wrapCol(col);
    const tile = this.grid[row][wrappedCol];
    if (tile === TILE.PELLET || tile === TILE.POWER) {
      this.grid[row][wrappedCol] = TILE.EMPTY;
      this.remainingPellets = Math.max(0, this.remainingPellets - 1);
      return tile;
    }
    return TILE.EMPTY;
  }

  getConsumedCount() {
    return this.totalPellets - this.remainingPellets;
  }
}

// ===== src/ghostAI.js =====
/**
 * 经典 4 幽灵个性化 AI 与有限状态机寻路算法
 * - Blinky: 直接追踪玩家当前格
 * - Pinky: 预判玩家前方 4 格（伏击）
 * - Inky: 以玩家前方 2 格为支点，将 Blinky 向量翻倍（包抄）
 * - Clyde: 距离 > 8 格时追踪玩家，<= 8 格时撤回左下角散开点
 */

function squaredDistance(colA, rowA, colB, rowB) {
  const dx = colA - colB;
  const dy = rowA - rowB;
  return dx * dx + dy * dy;
}

/**
 * 计算单个幽灵在当前模式下的目标瓦片坐标
 */
function computeGhostTargetTile(ghost, pacman, blinky) {
  if (ghost.mode === GHOST_MODE.EATEN) {
    return { col: Math.floor(GHOST_HOUSE_EXIT.col), row: GHOST_HOUSE_EXIT.row };
  }
  if (ghost.mode === GHOST_MODE.SCATTER) {
    return { ...ghost.scatterTarget };
  }

  const pCol = Math.round(pacman.col);
  const pRow = Math.round(pacman.row);
  const pDir = pacman.dir;

  switch (ghost.id) {
    case 'blinky':
      return { col: pCol, row: pRow };

    case 'pinky':
      return {
        col: pCol + pDir.x * 4,
        row: pRow + pDir.y * 4,
      };

    case 'inky': {
      const pivotCol = pCol + pDir.x * 2;
      const pivotRow = pRow + pDir.y * 2;
      const bCol = blinky ? Math.round(blinky.col) : pCol;
      const bRow = blinky ? Math.round(blinky.row) : pRow;
      return {
        col: pivotCol + (pivotCol - bCol),
        row: pivotRow + (pivotRow - bRow),
      };
    }

    case 'clyde': {
      const distSq = squaredDistance(ghost.col, ghost.row, pacman.col, pacman.row);
      if (distSq > 64) {
        return { col: pCol, row: pRow };
      }
      return { ...ghost.scatterTarget };
    }

    default:
      return { col: pCol, row: pRow };
  }
}

/**
 * 在路口选择下一步方向：
 * 1. 禁止 180 度原地掉头（除非被逼入死胡同）
 * 2. 恐惧模式下使用确定性可注入随机源在可行方向中随机选取
 * 3. 其他模式选择到目标瓦片欧氏距离最小的方向，距离相等时按 UP > LEFT > DOWN > RIGHT 优先级决胜
 */
function chooseGhostDirection(ghost, maze, targetTile, rng = Math.random) {
  const tileCol = Math.round(ghost.col);
  const tileRow = Math.round(ghost.row);
  const opposite = OPPOSITE_DIR[ghost.dir.name] || null;
  const canPassGate = ghost.mode === GHOST_MODE.EATEN;

  const validDirs = [];
  for (const dir of CARDINAL_DIRS) {
    if (opposite && dir.name === opposite.name) continue;
    const nextCol = tileCol + dir.x;
    const nextRow = tileRow + dir.y;
    if (maze.isWalkable(nextCol, nextRow, canPassGate)) {
      validDirs.push(dir);
    }
  }

  // 若无非掉头方向可行，允许掉头兜底
  if (validDirs.length === 0) {
    if (opposite && maze.isWalkable(tileCol + opposite.x, tileRow + opposite.y, canPassGate)) {
      return opposite;
    }
    return ghost.dir;
  }

  if (ghost.mode === GHOST_MODE.FRIGHTENED) {
    const idx = Math.floor(rng() * validDirs.length) % validDirs.length;
    return validDirs[idx];
  }

  let bestDir = validDirs[0];
  let bestDist = Infinity;
  for (const dir of validDirs) {
    const nextCol = tileCol + dir.x;
    const nextRow = tileRow + dir.y;
    const d = squaredDistance(nextCol, nextRow, targetTile.col, targetTile.row);
    if (d < bestDist) {
      bestDist = d;
      bestDir = dir;
    }
  }
  return bestDir;
}

/**
 * 根据关卡波次时间表计算当前全局模式 (SCATTER / CHASE)
 */
function getScheduledGlobalMode(waveTimer, waveSchedule) {
  let elapsed = 0;
  for (const phase of waveSchedule) {
    elapsed += phase.duration;
    if (waveTimer < elapsed) {
      return phase.mode;
    }
  }
  return GHOST_MODE.CHASE;
}

/**
 * 确定性街机游戏核心引擎（无 DOM 依赖，支持在 Node.js 中直接单元测试与集成测试）
 */



class PacmanGameEngine {
  constructor(options = {}) {
    this.rng = options.rng || Math.random;
    this.onEvent = options.onEvent || (() => {});
    this.maze = new Maze();
    this.highScore = options.highScore || 0;
    this.resetGame();
  }

  resetGame() {
    this.score = 0;
    this.lives = 3;
    this.level = 1;
    this.extraLifeAwarded = false;
    this.state = GAME_STATE.TITLE;
    this.stateTimer = 0;
    this.waveTimer = 0;
    this.globalGhostMode = GHOST_MODE.SCATTER;
    this.frightenedTimer = 0;
    this.ghostCombo = 0;
    this.fruit = null;
    this.fruitSpawnedStages = new Set();
    this.popups = [];
    this.maze.reset();
    this.levelConfig = getLevelConfig(this.level);
    this._resetEntities();
  }

  startGame() {
    this.resetGame();
    this.state = GAME_STATE.READY;
    this.stateTimer = 1.6;
    this._emit('GAME_START', { level: this.level });
  }

  togglePause() {
    if (this.state === GAME_STATE.PLAYING) {
      this.state = GAME_STATE.PAUSED;
      this._emit('PAUSE', { paused: true });
    } else if (this.state === GAME_STATE.PAUSED) {
      this.state = GAME_STATE.PLAYING;
      this._emit('PAUSE', { paused: false });
    }
  }

  setInputDirection(dir) {
    if (!dir || dir.name === 'NONE') return;
    this.pacman.nextDir = dir;
  }

  _emit(type, payload = {}) {
    this.onEvent({ type, ...payload });
  }

  _resetEntities() {
    this.pacman = {
      col: PACMAN_START.col,
      row: PACMAN_START.row,
      dir: DIR.LEFT,
      nextDir: DIR.LEFT,
      mouthPhase: 0,
      moving: false,
    };

    this.ghosts = GHOST_CONFIGS.map((cfg) => ({
      id: cfg.id,
      name: cfg.name,
      cnName: cfg.cnName,
      color: cfg.color,
      col: cfg.startTile.col,
      row: cfg.startTile.row,
      dir: cfg.startInHouse ? DIR.UP : DIR.LEFT,
      mode: cfg.startInHouse ? GHOST_MODE.HOUSE : GHOST_MODE.SCATTER,
      scatterTarget: { ...cfg.scatterTarget },
      releaseTimer: cfg.releaseDelay,
      lastDecisionKey: null,
    }));

    this.frightenedTimer = 0;
    this.ghostCombo = 0;
    this.waveTimer = 0;
    this.globalGhostMode = GHOST_MODE.SCATTER;
  }

  _addScore(points, popupCol = null, popupRow = null, popupColor = '#ffe66d') {
    this.score += points;
    if (this.score > this.highScore) {
      this.highScore = this.score;
    }
    if (!this.extraLifeAwarded && this.score >= SCORE.EXTRA_LIFE_THRESHOLD) {
      this.extraLifeAwarded = true;
      this.lives++;
      this._emit('EXTRA_LIFE', { lives: this.lives });
    }
    if (popupCol !== null && popupRow !== null) {
      this.popups.push({
        text: `+${points}`,
        col: popupCol,
        row: popupRow,
        color: popupColor,
        ttl: 1.0,
      });
    }
  }

  /**
   * 固定步长推进游戏状态
   * @param {number} dt 秒（推荐 1/60）
   */
  update(dt) {
    const step = Math.min(Math.max(dt, 0), 0.05);

    // 更新飘字特效
    for (let i = this.popups.length - 1; i >= 0; i--) {
      this.popups[i].ttl -= step;
      this.popups[i].row -= step * 0.8;
      if (this.popups[i].ttl <= 0) {
        this.popups.splice(i, 1);
      }
    }

    if (this.state === GAME_STATE.TITLE || this.state === GAME_STATE.PAUSED || this.state === GAME_STATE.GAME_OVER) {
      return;
    }

    if (this.state === GAME_STATE.READY) {
      this.stateTimer -= step;
      if (this.stateTimer <= 0) {
        this.state = GAME_STATE.PLAYING;
        this._emit('PLAY_BEGIN', { level: this.level });
      }
      return;
    }

    if (this.state === GAME_STATE.DYING) {
      this.stateTimer -= step;
      if (this.stateTimer <= 0) {
        if (this.lives <= 0) {
          this.state = GAME_STATE.GAME_OVER;
          this._emit('GAME_OVER', { score: this.score, highScore: this.highScore });
        } else {
          this._resetEntities();
          this.state = GAME_STATE.READY;
          this.stateTimer = 1.4;
        }
      }
      return;
    }

    if (this.state === GAME_STATE.LEVEL_CLEAR) {
      this.stateTimer -= step;
      if (this.stateTimer <= 0) {
        this.level++;
        this.levelConfig = getLevelConfig(this.level);
        this.maze.reset();
        this.fruit = null;
        this.fruitSpawnedStages.clear();
        this._resetEntities();
        this.state = GAME_STATE.READY;
        this.stateTimer = 1.6;
        this._emit('LEVEL_START', { level: this.level });
      }
      return;
    }

    // PLAYING 状态更新
    this._updateModeTimers(step);
    this._updatePacman(step);
    this._checkPelletAndFruit();
    this._updateGhosts(step);
    this._checkGhostCollisions();
  }

  _updateModeTimers(dt) {
    if (this.frightenedTimer > 0) {
      this.frightenedTimer = Math.max(0, this.frightenedTimer - dt);
      if (this.frightenedTimer === 0) {
        this.ghostCombo = 0;
        for (const ghost of this.ghosts) {
          if (ghost.mode === GHOST_MODE.FRIGHTENED) {
            ghost.mode = this.globalGhostMode;
          }
        }
      }
    } else {
      this.waveTimer += dt;
      const nextGlobal = getScheduledGlobalMode(this.waveTimer, this.levelConfig.waveSchedule);
      if (nextGlobal !== this.globalGhostMode) {
        this.globalGhostMode = nextGlobal;
        for (const ghost of this.ghosts) {
          if (ghost.mode === GHOST_MODE.SCATTER || ghost.mode === GHOST_MODE.CHASE) {
            ghost.mode = nextGlobal;
            ghost.dir = OPPOSITE_DIR[ghost.dir.name] || ghost.dir;
            ghost.lastDecisionKey = null;
          }
        }
      }
    }

    if (this.fruit) {
      this.fruit.ttl -= dt;
      if (this.fruit.ttl <= 0) {
        this.fruit = null;
      }
    }
  }

  _updatePacman(dt) {
    const p = this.pacman;
    const speed = this.levelConfig.pacmanSpeed;
    const moveDist = speed * dt;

    // 尝试立即反向
    if (p.nextDir.name === OPPOSITE_DIR[p.dir.name]?.name) {
      p.dir = p.nextDir;
    }

    const tileCol = Math.round(p.col);
    const tileRow = Math.round(p.row);
    const nearCenterX = Math.abs(p.col - tileCol) <= Math.max(0.14, moveDist * 1.1);
    const nearCenterY = Math.abs(p.row - tileRow) <= Math.max(0.14, moveDist * 1.1);

    // 预输入转弯缓冲
    if (p.nextDir.name !== p.dir.name && nearCenterX && nearCenterY) {
      if (this.maze.isWalkable(tileCol + p.nextDir.x, tileRow + p.nextDir.y, false)) {
        p.col = tileCol;
        p.row = tileRow;
        p.dir = p.nextDir;
      }
    }

    // 沿当前方向推进
    const targetCol = p.col + p.dir.x * moveDist;
    const targetRow = p.row + p.dir.y * moveDist;

    // 前方格碰撞检测
    const checkCol = p.dir.x > 0 ? Math.floor(targetCol + 0.49) : p.dir.x < 0 ? Math.ceil(targetCol - 0.49) : tileCol;
    const checkRow = p.dir.y > 0 ? Math.floor(targetRow + 0.49) : p.dir.y < 0 ? Math.ceil(targetRow - 0.49) : tileRow;

    if (this.maze.isWalkable(checkCol, checkRow, false)) {
      p.col = targetCol;
      p.row = targetRow;
      // 保持正交轴对齐，防止微小偏移卡墙
      if (p.dir.x !== 0) p.row = tileRow;
      if (p.dir.y !== 0) p.col = tileCol;
      p.moving = true;
      p.mouthPhase = (p.mouthPhase + dt * 11) % (Math.PI * 2);
    } else {
      // 贴齐当前格中心停下
      p.col = tileCol;
      p.row = tileRow;
      p.moving = false;
    }

    // 左右隧道穿越
    if (p.col < -0.5) p.col += MAZE_COLS;
    if (p.col >= MAZE_COLS - 0.5) p.col -= MAZE_COLS;
  }

  _checkPelletAndFruit() {
    const col = Math.round(this.pacman.col);
    const row = Math.round(this.pacman.row);
    const eaten = this.maze.consumePellet(col, row);

    if (eaten === TILE.PELLET) {
      this._addScore(SCORE.PELLET);
      this._emit('PELLET_EATEN', { col, row, score: this.score });
    } else if (eaten === TILE.POWER) {
      this._addScore(SCORE.POWER_PELLET);
      this.frightenedTimer = this.levelConfig.frightenedDuration;
      this.ghostCombo = 0;
      for (const ghost of this.ghosts) {
        if (ghost.mode === GHOST_MODE.SCATTER || ghost.mode === GHOST_MODE.CHASE || ghost.mode === GHOST_MODE.FRIGHTENED) {
          ghost.mode = GHOST_MODE.FRIGHTENED;
          ghost.dir = OPPOSITE_DIR[ghost.dir.name] || ghost.dir;
          ghost.lastDecisionKey = null;
        }
      }
      this._emit('POWER_PELLET', { col, row, duration: this.frightenedTimer });
    }

    // 奖励水果触发（吃满 70 颗与 170 颗豆子时出现）
    const consumed = this.maze.getConsumedCount();
    if ((consumed === 70 || consumed === 170) && !this.fruitSpawnedStages.has(consumed)) {
      this.fruitSpawnedStages.add(consumed);
      this.fruit = {
        ...this.levelConfig.fruit,
        col: FRUIT_SPAWN.col,
        row: FRUIT_SPAWN.row,
        ttl: 9.5,
      };
      this._emit('FRUIT_SPAWN', { fruit: this.fruit });
    }

    if (this.fruit) {
      if (squaredDistance(this.pacman.col, this.pacman.row, this.fruit.col, this.fruit.row) < 0.45) {
        const pts = this.fruit.points;
        this._addScore(pts, this.fruit.col, this.fruit.row, this.fruit.color);
        this._emit('FRUIT_EATEN', { fruit: this.fruit, points: pts });
        this.fruit = null;
      }
    }

    // 清空全部豆子通关
    if (this.maze.remainingPellets === 0) {
      this.state = GAME_STATE.LEVEL_CLEAR;
      this.stateTimer = 2.2;
      this._emit('LEVEL_CLEAR', { level: this.level, score: this.score });
    }
  }

  _updateGhosts(dt) {
    const blinky = this.ghosts[0];

    for (const ghost of this.ghosts) {
      if (ghost.mode === GHOST_MODE.HOUSE) {
        ghost.releaseTimer -= dt;
        if (ghost.releaseTimer <= 0) {
          // 沿中心上移出幽灵屋
          const dx = GHOST_HOUSE_EXIT.col - ghost.col;
          const step = 3.6 * dt;
          if (Math.abs(dx) > step) {
            ghost.col += Math.sign(dx) * step;
          } else {
            ghost.col = GHOST_HOUSE_EXIT.col;
            if (ghost.row > GHOST_HOUSE_EXIT.row) {
              ghost.row = Math.max(GHOST_HOUSE_EXIT.row, ghost.row - step);
            } else {
              ghost.row = GHOST_HOUSE_EXIT.row;
              ghost.mode = this.frightenedTimer > 0 ? GHOST_MODE.FRIGHTENED : this.globalGhostMode;
              ghost.dir = DIR.LEFT;
              ghost.lastDecisionKey = null;
            }
          }
        }
        continue;
      }

      // 计算当前速度
      let speed = this.levelConfig.ghostSpeed;
      if (ghost.mode === GHOST_MODE.EATEN) {
        speed = this.levelConfig.eatenSpeed;
      } else if (ghost.mode === GHOST_MODE.FRIGHTENED) {
        speed = this.levelConfig.frightenedSpeed;
      } else if (this.maze.isTunnel(Math.round(ghost.col), Math.round(ghost.row))) {
        speed = this.levelConfig.tunnelSpeed;
      }

      const moveDist = speed * dt;
      const tileCol = Math.round(ghost.col);
      const tileRow = Math.round(ghost.row);

      // 回到幽灵屋门口后重生
      if (
        ghost.mode === GHOST_MODE.EATEN &&
        squaredDistance(ghost.col, ghost.row, GHOST_HOUSE_EXIT.col, GHOST_HOUSE_EXIT.row) < 0.25
      ) {
        ghost.col = GHOST_HOUSE_CENTER.col;
        ghost.row = GHOST_HOUSE_CENTER.row;
        ghost.mode = GHOST_MODE.HOUSE;
        ghost.releaseTimer = 0.6;
        ghost.lastDecisionKey = null;
        continue;
      }

      const nearCenter =
        Math.abs(ghost.col - tileCol) <= Math.max(0.12, moveDist * 1.1) &&
        Math.abs(ghost.row - tileRow) <= Math.max(0.12, moveDist * 1.1);
      const decisionKey = `${tileCol},${tileRow}`;

      if (nearCenter && ghost.lastDecisionKey !== decisionKey) {
        ghost.col = tileCol;
        ghost.row = tileRow;
        const target = computeGhostTargetTile(ghost, this.pacman, blinky);
        ghost.dir = chooseGhostDirection(ghost, this.maze, target, this.rng);
        ghost.lastDecisionKey = decisionKey;
      }

      const nextCol = ghost.col + ghost.dir.x * moveDist;
      const nextRow = ghost.row + ghost.dir.y * moveDist;
      const canPassGate = ghost.mode === GHOST_MODE.EATEN;
      const checkCol = ghost.dir.x > 0 ? Math.floor(nextCol + 0.49) : ghost.dir.x < 0 ? Math.ceil(nextCol - 0.49) : tileCol;
      const checkRow = ghost.dir.y > 0 ? Math.floor(nextRow + 0.49) : ghost.dir.y < 0 ? Math.ceil(nextRow - 0.49) : tileRow;

      if (this.maze.isWalkable(checkCol, checkRow, canPassGate)) {
        ghost.col = nextCol;
        ghost.row = nextRow;
      } else {
        ghost.col = tileCol;
        ghost.row = tileRow;
        ghost.lastDecisionKey = null;
      }

      if (ghost.col < -0.5) ghost.col += MAZE_COLS;
      if (ghost.col >= MAZE_COLS - 0.5) ghost.col -= MAZE_COLS;
    }
  }

  _checkGhostCollisions() {
    for (const ghost of this.ghosts) {
      if (ghost.mode === GHOST_MODE.HOUSE || ghost.mode === GHOST_MODE.EATEN) continue;
      const distSq = squaredDistance(this.pacman.col, this.pacman.row, ghost.col, ghost.row);
      if (distSq < 0.42) {
        if (ghost.mode === GHOST_MODE.FRIGHTENED) {
          ghost.mode = GHOST_MODE.EATEN;
          ghost.lastDecisionKey = null;
          const pts = SCORE.GHOST_BASE * Math.pow(2, this.ghostCombo);
          this.ghostCombo = Math.min(3, this.ghostCombo + 1);
          this._addScore(pts, ghost.col, ghost.row, '#00f5d4');
          this._emit('GHOST_EATEN', { ghostId: ghost.id, points: pts, combo: this.ghostCombo });
        } else {
          this.lives--;
          this.state = GAME_STATE.DYING;
          this.stateTimer = 1.4;
          this._emit('PACMAN_DIED', { lives: this.lives, killer: ghost.id });
          return;
        }
      }
    }
  }
}

/**
 * 复古街机 Web Audio API 合成器（零外部音频依赖）
 */

class ArcadeAudio {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.wakaFlip = false;
  }

  unlock() {
    if (this.muted) return;
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) {
        this.ctx = new AudioCtx();
      }
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
  }

  setMuted(muted) {
    this.muted = Boolean(muted);
  }

  toggleMute() {
    this.muted = !this.muted;
    if (!this.muted) this.unlock();
    return this.muted;
  }

  _tone(freqStart, freqEnd, duration, type = 'square', gainPeak = 0.08, delay = 0) {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, now);
    if (freqEnd !== freqStart) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), now + duration);
    }
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(gainPeak, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.02);
  }

  playWaka() {
    this.wakaFlip = !this.wakaFlip;
    if (this.wakaFlip) {
      this._tone(240, 420, 0.075, 'triangle', 0.07);
    } else {
      this._tone(380, 210, 0.075, 'triangle', 0.07);
    }
  }

  playPowerPellet() {
    this._tone(220, 660, 0.16, 'sawtooth', 0.07, 0);
    this._tone(330, 880, 0.18, 'square', 0.06, 0.08);
  }

  playGhostEaten() {
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((n, i) => {
      this._tone(n, n * 1.08, 0.08, 'square', 0.08, i * 0.055);
    });
  }

  playFruit() {
    this._tone(587.33, 880, 0.09, 'triangle', 0.08, 0);
    this._tone(880, 1174.66, 0.12, 'triangle', 0.08, 0.09);
  }

  playStartJingle() {
    const melody = [
      [493.88, 0.1], [987.77, 0.1], [739.99, 0.1], [622.25, 0.1],
      [987.77, 0.08], [739.99, 0.14], [622.25, 0.18],
      [523.25, 0.1], [1046.5, 0.1], [783.99, 0.1], [659.25, 0.1],
      [1046.5, 0.08], [783.99, 0.14], [659.25, 0.2],
    ];
    let t = 0;
    for (const [freq, dur] of melody) {
      this._tone(freq, freq, dur * 0.9, 'square', 0.055, t);
      t += dur;
    }
  }

  playDeath() {
    const steps = 10;
    for (let i = 0; i < steps; i++) {
      const f = 620 - i * 48;
      this._tone(f, f * 0.85, 0.09, 'sawtooth', 0.075, i * 0.095);
    }
  }

  playLevelClear() {
    const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
    notes.forEach((n, i) => {
      this._tone(n, n, 0.13, 'square', 0.07, i * 0.12);
    });
  }

  playExtraLife() {
    const notes = [659.25, 783.99, 1318.5, 1046.5, 1174.66, 1567.98];
    notes.forEach((n, i) => {
      this._tone(n, n, 0.1, 'triangle', 0.09, i * 0.085);
    });
  }
}

/**
 * HTML5 Canvas 2D 街机渲染引擎
 * 包含霓虹迷宫墙体、粒子系统、吃豆人/幽灵动画、飘字与状态覆盖层
 */

class ArcadeRenderer {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.canvas.width = CANVAS_WIDTH;
    this.canvas.height = CANVAS_HEIGHT;
    this.particles = [];
    this.elapsed = 0;
  }

  spawnParticles(col, row, color, count = 12) {
    const cx = (col + 0.5) * TILE_SIZE;
    const cy = (row + 0.5) * TILE_SIZE;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const speed = 35 + Math.random() * 85;
      this.particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.45 + Math.random() * 0.25,
        maxLife: 0.7,
        size: 2 + Math.random() * 2.5,
        color,
      });
    }
  }

  render(engine, dt = 0.016) {
    this.elapsed += dt;
    const ctx = this.ctx;

    // 背景清空
    ctx.fillStyle = '#070913';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    this._drawMaze(engine);
    this._drawFruit(engine);
    this._drawPacman(engine);
    this._drawGhosts(engine);
    this._updateAndDrawParticles(dt);
    this._drawPopups(engine);
    this._drawStateOverlay(engine);
  }

  _drawMaze(engine) {
    const ctx = this.ctx;
    const { grid } = engine.maze;
    const isFlashClear = engine.state === GAME_STATE.LEVEL_CLEAR && Math.floor(this.elapsed * 8) % 2 === 0;
    const wallStroke = isFlashClear ? '#ffffff' : '#2563eb';
    const wallGlow = isFlashClear ? 'rgba(255,255,255,0.6)' : 'rgba(56, 189, 248, 0.55)';

    ctx.save();
    for (let r = 0; r < MAZE_ROWS; r++) {
      for (let c = 0; c < MAZE_COLS; c++) {
        const tile = grid[r][c];
        const x = c * TILE_SIZE;
        const y = r * TILE_SIZE;

        if (tile === TILE.WALL) {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(x + 1, y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
          ctx.strokeStyle = wallStroke;
          ctx.lineWidth = 1.6;
          ctx.shadowColor = wallGlow;
          ctx.shadowBlur = 4;
          ctx.strokeRect(x + 2, y + 2, TILE_SIZE - 4, TILE_SIZE - 4);
          ctx.shadowBlur = 0;
        } else if (tile === TILE.GHOST_GATE) {
          ctx.fillStyle = '#f472b6';
          ctx.fillRect(x, y + TILE_SIZE * 0.42, TILE_SIZE, 3);
        } else if (tile === TILE.PELLET) {
          ctx.fillStyle = '#fde68a';
          ctx.beginPath();
          ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        } else if (tile === TILE.POWER) {
          const pulse = 5.2 + Math.sin(this.elapsed * 9) * 1.4;
          ctx.fillStyle = '#fef08a';
          ctx.shadowColor = '#facc15';
          ctx.shadowBlur = 10;
          ctx.beginPath();
          ctx.arc(x + TILE_SIZE / 2, y + TILE_SIZE / 2, pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
        }
      }
    }
    ctx.restore();
  }

  _drawFruit(engine) {
    if (!engine.fruit) return;
    const ctx = this.ctx;
    const cx = (engine.fruit.col + 0.5) * TILE_SIZE;
    const cy = (engine.fruit.row + 0.5) * TILE_SIZE;
    const bob = Math.sin(this.elapsed * 6) * 2;

    ctx.save();
    ctx.shadowColor = engine.fruit.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = engine.fruit.color;
    ctx.beginPath();
    ctx.arc(cx, cy + bob, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#4ade80';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 6 + bob);
    ctx.quadraticCurveTo(cx + 4, cy - 12 + bob, cx + 7, cy - 9 + bob);
    ctx.stroke();
    ctx.restore();
  }

  _drawPacman(engine) {
    const ctx = this.ctx;
    const p = engine.pacman;
    const cx = (p.col + 0.5) * TILE_SIZE;
    const cy = (p.row + 0.5) * TILE_SIZE;
    const radius = TILE_SIZE * 0.45;

    ctx.save();
    ctx.translate(cx, cy);

    if (engine.state === GAME_STATE.DYING) {
      const progress = Math.min(1, Math.max(0, 1 - engine.stateTimer / 1.4));
      const openAngle = Math.PI * progress;
      if (progress < 0.96) {
        ctx.fillStyle = '#facc15';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, -Math.PI / 2 + openAngle, Math.PI * 1.5 - openAngle);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
      return;
    }

    let angleOffset = 0;
    if (p.dir.name === 'LEFT') angleOffset = Math.PI;
    else if (p.dir.name === 'UP') angleOffset = -Math.PI / 2;
    else if (p.dir.name === 'DOWN') angleOffset = Math.PI / 2;

    ctx.rotate(angleOffset);
    const mouth = p.moving ? 0.08 + Math.abs(Math.sin(p.mouthPhase)) * 0.34 : 0.22;

    ctx.shadowColor = '#facc15';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, mouth * Math.PI, (2 - mouth) * Math.PI);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  _drawGhosts(engine) {
    const ctx = this.ctx;
    const radius = TILE_SIZE * 0.44;
    const wave = Math.sin(this.elapsed * 14) * 1.6;

    for (const ghost of engine.ghosts) {
      const cx = (ghost.col + 0.5) * TILE_SIZE;
      const cy = (ghost.row + 0.5) * TILE_SIZE;
      ctx.save();
      ctx.translate(cx, cy);

      if (ghost.mode !== GHOST_MODE.EATEN) {
        let bodyColor = ghost.color;
        if (ghost.mode === GHOST_MODE.FRIGHTENED) {
          const flashing = engine.frightenedTimer < 2.0 && Math.floor(this.elapsed * 10) % 2 === 0;
          bodyColor = flashing ? '#e2e8f0' : '#2563eb';
        }

        ctx.shadowColor = bodyColor;
        ctx.shadowBlur = 8;
        ctx.fillStyle = bodyColor;

        // 圆顶 + 波浪裙边
        ctx.beginPath();
        ctx.arc(0, -1, radius, Math.PI, 0, false);
        ctx.lineTo(radius, radius);
        ctx.lineTo(radius * 0.5, radius - 3 + wave * 0.5);
        ctx.lineTo(0, radius);
        ctx.lineTo(-radius * 0.5, radius - 3 - wave * 0.5);
        ctx.lineTo(-radius, radius);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // 眼睛绘制
      if (ghost.mode === GHOST_MODE.FRIGHTENED) {
        ctx.fillStyle = '#fef08a';
        ctx.beginPath();
        ctx.arc(-3.5, -2, 1.8, 0, Math.PI * 2);
        ctx.arc(3.5, -2, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-4.5, 3);
        ctx.lineTo(-2, 1.5);
        ctx.lineTo(0, 3);
        ctx.lineTo(2, 1.5);
        ctx.lineTo(4.5, 3);
        ctx.stroke();
      } else {
        const eyeOffsetX = ghost.dir.x * 1.8;
        const eyeOffsetY = ghost.dir.y * 1.8;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(-3.5, -2.5, 2.8, 3.4, 0, 0, Math.PI * 2);
        ctx.ellipse(3.5, -2.5, 2.8, 3.4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-3.5 + eyeOffsetX, -2.5 + eyeOffsetY, 1.5, 0, Math.PI * 2);
        ctx.arc(3.5 + eyeOffsetX, -2.5 + eyeOffsetY, 1.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  _updateAndDrawParticles(dt) {
    const ctx = this.ctx;
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const pt = this.particles[i];
      pt.life -= dt;
      if (pt.life <= 0) {
        this.particles.splice(i, 1);
        continue;
      }
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= 0.96;
      pt.vy *= 0.96;

      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
      ctx.restore();
    }
  }

  _drawPopups(engine) {
    const ctx = this.ctx;
    ctx.save();
    ctx.font = 'bold 13px "Courier New", monospace';
    ctx.textAlign = 'center';
    for (const pop of engine.popups) {
      ctx.globalAlpha = Math.min(1, pop.ttl * 1.4);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, (pop.col + 0.5) * TILE_SIZE, (pop.row + 0.5) * TILE_SIZE);
    }
    ctx.restore();
  }

  _drawStateOverlay(engine) {
    const ctx = this.ctx;
    if (engine.state === GAME_STATE.PLAYING || engine.state === GAME_STATE.DYING) return;

    ctx.save();
    if (engine.state === GAME_STATE.READY) {
      ctx.fillStyle = 'rgba(7, 9, 19, 0.55)';
      ctx.fillRect(CANVAS_WIDTH / 2 - 90, 17 * TILE_SIZE - 16, 180, 32);
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillStyle = '#facc15';
      ctx.textAlign = 'center';
      ctx.fillText('READY!', CANVAS_WIDTH / 2, 17 * TILE_SIZE + 6);
      ctx.restore();
      return;
    }

    ctx.fillStyle = 'rgba(7, 9, 19, 0.78)';
    ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    ctx.textAlign = 'center';

    if (engine.state === GAME_STATE.TITLE) {
      ctx.fillStyle = '#facc15';
      ctx.shadowColor = '#facc15';
      ctx.shadowBlur = 16;
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillText('NEON PAC-ARCADE', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.36);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 15px "Courier New", monospace';
      ctx.fillText('经典街机《吃豆人》网页复刻版', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.43);

      const blink = Math.floor(this.elapsed * 2.5) % 2 === 0;
      if (blink) {
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 16px "Courier New", monospace';
        ctx.fillText('按 ENTER / 点击「投币开始」', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.55);
      }

      ctx.fillStyle = '#94a3b8';
      ctx.font = '13px "Courier New", monospace';
      ctx.fillText('方向键 / WASD 移动 · P 暂停 · M 静音', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.64);
    } else if (engine.state === GAME_STATE.PAUSED) {
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 30px "Courier New", monospace';
      ctx.fillText('PAUSED', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.46);
      ctx.fillStyle = '#cbd5e1';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('按 P 或点击「继续」恢复游戏', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.54);
    } else if (engine.state === GAME_STATE.LEVEL_CLEAR) {
      ctx.fillStyle = '#4ade80';
      ctx.font = 'bold 28px "Courier New", monospace';
      ctx.fillText(`STAGE ${engine.level} CLEAR!`, CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.47);
      ctx.fillStyle = '#e2e8f0';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('正在载入下一关卡...', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.55);
    } else if (engine.state === GAME_STATE.GAME_OVER) {
      ctx.fillStyle = '#ff2a54';
      ctx.shadowColor = '#ff2a54';
      ctx.shadowBlur = 14;
      ctx.font = 'bold 34px "Courier New", monospace';
      ctx.fillText('GAME OVER', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.43);
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#facc15';
      ctx.font = 'bold 18px "Courier New", monospace';
      ctx.fillText(`FINAL SCORE: ${engine.score}`, CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.52);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = '14px "Courier New", monospace';
      ctx.fillText('按 ENTER / 点击「重新开始」再来一局', CANVAS_WIDTH / 2, CANVAS_HEIGHT * 0.60);
    }
    ctx.restore();
  }
}

// ===== src/main.js =====
/**
 * 浏览器入口模块：绑定主循环、键盘/触控输入、HUD 同步与本地高分存储
 */




const STORAGE_KEY = 'neon_pac_arcade_highscore_v1';

function readSavedHighScore() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    const parsed = Number.parseInt(raw || '0', 10);
    return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
  } catch {
    return 0;
  }
}

function saveHighScore(score) {
  try {
    window.localStorage.setItem(STORAGE_KEY, String(score));
  } catch {
    // 沙盒无权限时静默忽略
  }
}

function bootArcadeApp() {
  const canvas = document.getElementById('arcade-canvas');
  const scoreEl = document.getElementById('hud-score');
  const highScoreEl = document.getElementById('hud-highscore');
  const levelEl = document.getElementById('hud-level');
  const livesEl = document.getElementById('hud-lives');
  const pelletsEl = document.getElementById('hud-pellets');
  const modeEl = document.getElementById('hud-mode');
  const startBtn = document.getElementById('btn-start');
  const pauseBtn = document.getElementById('btn-pause');
  const muteBtn = document.getElementById('btn-mute');
  const crtBtn = document.getElementById('btn-crt');
  const cabinetScreen = document.getElementById('cabinet-screen');

  if (!canvas) return;

  const audio = new ArcadeAudio();
  const renderer = new ArcadeRenderer(canvas);

  const engine = new PacmanGameEngine({
    highScore: readSavedHighScore(),
    onEvent: (evt) => {
      switch (evt.type) {
        case 'GAME_START':
          audio.playStartJingle();
          break;
        case 'PELLET_EATEN':
          audio.playWaka();
          break;
        case 'POWER_PELLET':
          audio.playPowerPellet();
          renderer.spawnParticles(evt.col, evt.row, '#fef08a', 14);
          break;
        case 'GHOST_EATEN':
          audio.playGhostEaten();
          renderer.spawnParticles(engine.pacman.col, engine.pacman.row, '#00f5d4', 18);
          break;
        case 'FRUIT_EATEN':
          audio.playFruit();
          renderer.spawnParticles(engine.pacman.col, engine.pacman.row, evt.fruit.color, 16);
          break;
        case 'PACMAN_DIED':
          audio.playDeath();
          renderer.spawnParticles(engine.pacman.col, engine.pacman.row, '#facc15', 22);
          break;
        case 'LEVEL_CLEAR':
          audio.playLevelClear();
          break;
        case 'EXTRA_LIFE':
          audio.playExtraLife();
          break;
        case 'GAME_OVER':
          saveHighScore(engine.highScore);
          break;
        default:
          break;
      }
      if (engine.score >= engine.highScore && engine.highScore > 0) {
        saveHighScore(engine.highScore);
      }
    },
  });

  function syncHud() {
    if (scoreEl) scoreEl.textContent = String(engine.score).padStart(6, '0');
    if (highScoreEl) highScoreEl.textContent = String(engine.highScore).padStart(6, '0');
    if (levelEl) levelEl.textContent = `STAGE ${engine.level}`;
    if (livesEl) livesEl.textContent = '● '.repeat(Math.max(0, engine.lives)).trim() || '0';
    if (pelletsEl) pelletsEl.textContent = `${engine.maze.remainingPellets}/${engine.maze.totalPellets}`;

    if (modeEl) {
      if (engine.frightenedTimer > 0) {
        modeEl.textContent = `FRIGHT ${engine.frightenedTimer.toFixed(1)}s`;
        modeEl.dataset.mode = 'fright';
      } else {
        modeEl.textContent = engine.globalGhostMode;
        modeEl.dataset.mode = engine.globalGhostMode.toLowerCase();
      }
    }

    if (startBtn) {
      startBtn.textContent =
        engine.state === GAME_STATE.TITLE
          ? '投币开始'
          : engine.state === GAME_STATE.GAME_OVER
            ? '重新开始'
            : '重开一局';
    }
    if (pauseBtn) {
      pauseBtn.textContent = engine.state === GAME_STATE.PAUSED ? '继续 (P)' : '暂停 (P)';
      pauseBtn.disabled =
        engine.state !== GAME_STATE.PLAYING && engine.state !== GAME_STATE.PAUSED;
    }
  }

  function handleStart() {
    audio.unlock();
    engine.startGame();
    syncHud();
  }

  function handleDirection(dir) {
    audio.unlock();
    if (engine.state === GAME_STATE.TITLE) {
      engine.startGame();
    }
    if (engine.state === GAME_STATE.PLAYING || engine.state === GAME_STATE.READY) {
      engine.setInputDirection(dir);
    }
  }

  // 按钮事件绑定
  if (startBtn) startBtn.addEventListener('click', handleStart);
  if (pauseBtn) {
    pauseBtn.addEventListener('click', () => {
      audio.unlock();
      engine.togglePause();
      syncHud();
    });
  }
  if (muteBtn) {
    muteBtn.addEventListener('click', () => {
      const muted = audio.toggleMute();
      muteBtn.textContent = muted ? '音效: 关 (M)' : '音效: 开 (M)';
      muteBtn.setAttribute('aria-pressed', String(!muted));
    });
  }
  if (crtBtn && cabinetScreen) {
    crtBtn.addEventListener('click', () => {
      const enabled = cabinetScreen.classList.toggle('crt-enabled');
      crtBtn.textContent = enabled ? 'CRT扫描线: 开' : 'CRT扫描线: 关';
      crtBtn.setAttribute('aria-pressed', String(enabled));
    });
  }

  // 虚拟方向键绑定
  const dpadMap = {
    'dpad-up': DIR.UP,
    'dpad-down': DIR.DOWN,
    'dpad-left': DIR.LEFT,
    'dpad-right': DIR.RIGHT,
  };
  Object.entries(dpadMap).forEach(([id, dir]) => {
    const btn = document.getElementById(id);
    if (!btn) return;
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      handleDirection(dir);
    });
  });

  // 触屏滑动手势支持
  let touchStartX = 0;
  let touchStartY = 0;
  canvas.addEventListener(
    'touchstart',
    (e) => {
      if (e.touches.length === 0) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    },
    { passive: true },
  );
  canvas.addEventListener(
    'touchend',
    (e) => {
      if (e.changedTouches.length === 0) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        handleDirection(dx > 0 ? DIR.RIGHT : DIR.LEFT);
      } else {
        handleDirection(dy > 0 ? DIR.DOWN : DIR.UP);
      }
    },
    { passive: true },
  );

  // 键盘事件绑定
  window.addEventListener('keydown', (e) => {
    const key = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(key)) {
      e.preventDefault();
    }
    if (key === 'arrowup' || key === 'w') handleDirection(DIR.UP);
    else if (key === 'arrowdown' || key === 's') handleDirection(DIR.DOWN);
    else if (key === 'arrowleft' || key === 'a') handleDirection(DIR.LEFT);
    else if (key === 'arrowright' || key === 'd') handleDirection(DIR.RIGHT);
    else if (key === 'enter' || key === ' ') {
      if (engine.state === GAME_STATE.TITLE || engine.state === GAME_STATE.GAME_OVER) {
        handleStart();
      }
    } else if (key === 'p') {
      engine.togglePause();
      syncHud();
    } else if (key === 'm') {
      const muted = audio.toggleMute();
      if (muteBtn) muteBtn.textContent = muted ? '音效: 关 (M)' : '音效: 开 (M)';
    } else if (key === 'r') {
      handleStart();
    }
  });

  // 固定步长主循环（Accumulator 模式，确保不同刷新率下逻辑一致）
  const FIXED_DT = 1 / 60;
  let accumulator = 0;
  let lastTime = performance.now();
  let rafId = null;

  function frame(now) {
    const rawDt = Math.min(0.1, (now - lastTime) / 1000);
    lastTime = now;
    accumulator += rawDt;

    while (accumulator >= FIXED_DT) {
      engine.update(FIXED_DT);
      accumulator -= FIXED_DT;
    }

    renderer.render(engine, rawDt);
    syncHud();
    rafId = window.requestAnimationFrame(frame);
  }

  syncHud();
  renderer.render(engine, 0);
  if (rafId !== null) window.cancelAnimationFrame(rafId);
  rafId = window.requestAnimationFrame(frame);
}

window.addEventListener('load', bootArcadeApp);
})();
  </script>
