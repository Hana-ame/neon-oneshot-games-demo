<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web HOI — 1936 欧洲战区大战略</title>
  <style>
:root {
  --bg-dark: #0e141b;
  --panel-bg: #151e28;
  --panel-border: #2a394a;
  --accent-gold: #d4af37;
  --accent-blue: #38bdf8;
  --accent-red: #ef4444;
  --accent-green: #22c55e;
  --text-main: #e6edf3;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-dark);
  color: var(--text-main);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  user-select: none;
}

/* 顶部指挥栏 */
.topbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 12px;
  background: linear-gradient(180deg, #1b2633 0%, #111922 100%);
  border-bottom: 1px solid var(--panel-border);
  z-index: 20;
}

.brand-group {
  display: flex;
  align-items: center;
  gap: 10px;
}

.nation-select {
  background: #0f1722;
  color: var(--accent-gold);
  border: 1px solid var(--accent-gold);
  border-radius: 6px;
  padding: 4px 8px;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
}

.stats-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

.stat-pill {
  background: rgba(15, 23, 34, 0.85);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.stat-pill strong {
  color: #f8fafc;
}

.time-controls {
  display: flex;
  align-items: center;
  gap: 6px;
}

.date-display {
  background: #0b1118;
  border: 1px solid var(--accent-gold);
  color: #fef08a;
  font-weight: 700;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 6px;
  min-width: 112px;
  text-align: center;
}

.btn {
  background: #1e2c3b;
  color: var(--text-main);
  border: 1px solid #35495e;
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.btn:hover {
  background: #283b4f;
  border-color: var(--accent-gold);
}

.btn.active {
  background: var(--accent-gold);
  color: #0e141b;
  border-color: var(--accent-gold);
}

.btn.danger {
  background: #7f1d1d;
  border-color: #ef4444;
  color: #fee2e2;
}

.btn.danger:hover {
  background: #991b1b;
}

.btn.sm {
  padding: 3px 7px;
  font-size: 11px;
}

/* 主布局 */
.main-layout {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
}

/* 左侧司令部面板 */
.sidebar {
  width: 340px;
  max-width: 42vw;
  background: var(--panel-bg);
  border-right: 1px solid var(--panel-border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.tab-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: #101720;
  border-bottom: 1px solid var(--panel-border);
}

.tab-btn {
  background: transparent;
  color: var(--text-muted);
  border: none;
  border-bottom: 2px solid transparent;
  padding: 9px 4px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.tab-btn.active {
  color: var(--accent-gold);
  border-bottom-color: var(--accent-gold);
  background: rgba(212, 175, 55, 0.08);
}

.panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card {
  background: #101720;
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 10px;
}

.card-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--accent-gold);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  padding: 4px 0;
  border-bottom: 1px solid rgba(42, 57, 74, 0.45);
}

.row:last-child {
  border-bottom: none;
}

.muted {
  color: var(--text-muted);
  font-size: 11px;
}

.progress-bar {
  width: 100%;
  height: 6px;
  background: #1e293b;
  border-radius: 999px;
  overflow: hidden;
  margin-top: 4px;
}

.progress-fill {
  height: 100%;
  background: var(--accent-gold);
  transition: width 0.2s;
}

/* 地图视口 */
.map-stage {
  flex: 1;
  position: relative;
  min-width: 0;
  overflow: hidden;
}

#mapCanvas {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
}

#mapCanvas:active {
  cursor: grabbing;
}

.map-overlay-top {
  position: absolute;
  top: 10px;
  right: 12px;
  display: flex;
  gap: 6px;
  z-index: 10;
}

.map-overlay-bottom {
  position: absolute;
  bottom: 10px;
  left: 12px;
  right: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 10px;
  pointer-events: none;
  z-index: 10;
}

.province-inspector,
.event-log {
  pointer-events: auto;
  background: rgba(16, 23, 32, 0.92);
  border: 1px solid var(--panel-border);
  border-radius: 8px;
  padding: 10px;
  backdrop-filter: blur(6px);
}

.province-inspector {
  width: 280px;
  max-width: 48%;
}

.event-log {
  width: 340px;
  max-width: 48%;
  max-height: 130px;
  overflow-y: auto;
  font-size: 11px;
}

.log-item {
  padding: 2px 0;
  border-bottom: 1px solid rgba(42, 57, 74, 0.35);
  line-height: 1.4;
}

.log-item.war { color: #fca5a5; }
.log-item.tech { color: #7dd3fc; }
.log-item.focus { color: #fde047; }
.log-item.military { color: #86efac; }

.toast {
  position: fixed;
  top: 64px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(15, 23, 42, 0.95);
  border: 1px solid var(--accent-gold);
  color: #fef08a;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}

.toast.show {
  opacity: 1;
}

.badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  background: #1e293b;
  color: #cbd5e1;
}

.badge.war { background: #7f1d1d; color: #fecaca; }
.badge.ally { background: #14532d; color: #bbf7d0; }

@media (max-width: 820px) {
  .main-layout {
    flex-direction: column-reverse;
  }
  .sidebar {
    width: 100%;
    max-width: 100%;
    height: 44%;
    border-right: none;
    border-top: 1px solid var(--panel-border);
  }
  .event-log {
    display: none;
  }
  .province-inspector {
    width: 100%;
    max-width: 100%;
  }
}

</style>
</head>

    </div>

      <div class="stat-pill">🏛 政治 <strong id="statPP">0</strong></div>

      <div class="stat-pill">🏭 工业 <strong id="statFac">0/0</strong></div>
      <div class="stat-pill">🪖 师数 <strong id="statDivs">0</strong></div>
      <div class="stat-pill">🌍 紧张 <strong id="statTension">0%</strong></div>
    </div>

    <div class="time-controls">
      <div id="dateDisplay" class="date-display">1936-01-01 00:00</div>

      <button class="btn sm" data-speed="1">1x</button>
      <button class="btn sm" data-speed="3">3x</button>
      <button class="btn sm" data-speed="5">5x</button>
      <button id="btnSave" class="btn sm" title="保存战局">💾</button>
      <button id="btnLoad" class="btn sm" title="读取战局">📂</button>
      <button id="btnMute" class="btn sm" title="音效开关">🔊</button>
    </div>
  </header>

  <main class="main-layout">
    <aside class="sidebar">
      <nav class="tab-bar">
        <button class="tab-btn active" data-tab="military">军事</button>
        <button class="tab-btn" data-tab="production">工业</button>
        <button class="tab-btn" data-tab="research">科研</button>
        <button class="tab-btn" data-tab="focus">国策</button>
        <button class="tab-btn" data-tab="diplomacy">外交</button>
      </nav>
      <section id="panelBody" class="panel-body"></section>
    </aside>

    <section class="map-stage">
      <canvas id="mapCanvas"></canvas>

      <div class="map-overlay-top">
        <button class="btn sm active" data-mapmode="political">政治</button>
        <button class="btn sm" data-mapmode="terrain">地形</button>
        <button class="btn sm" data-mapmode="supply">补给</button>
        <button id="btnZoomIn" class="btn sm">+</button>
        <button id="btnZoomOut" class="btn sm">-</button>
        <button id="btnResetView" class="btn sm">重置</button>
      </div>

      <div class="map-overlay-bottom">
        <div id="provinceInspector" class="province-inspector"></div>
        <div id="eventLog" class="event-log"></div>
      </div>
    </section>
  </main>

/**
 * HOI 核心战斗结算引擎
 * 完整实现软攻/硬攻、防御/突破、装甲率/穿甲判定、地形修正、要塞、堑壕、补给惩罚与组织度/兵力损耗。
 */



/**
 * 汇总国家已解锁科技对部队属性的加成
 */
function computeNationTechModifiers(nation) {
  const mods = {
    softAttackMult: 1.0,
    hardAttackMult: 1.0,
    defenseMult: 1.0,
    breakthroughMult: 1.0,
    armorFlat: 0,
    piercingFlat: 0,
    speedMult: 1.0,
    supplyUseMult: 1.0,
    maxOrgFlat: 0,
    orgRecoveryMult: 1.0,
    factoryOutputMult: 1.0,
    constructionMult: 1.0,
    resourceMult: 1.0,
  };

  const completed = nation?.completedTechs || [];
  for (const techId of completed) {
    const tech = TECHNOLOGIES.find((t) => t.id === techId);
    if (!tech) continue;
    for (const [k, v] of Object.entries(tech.effects)) {
      if (k in mods) {
        mods[k] += v;
      }
    }
  }
  mods.supplyUseMult = Math.max(0.4, mods.supplyUseMult);
  return mods;
}

/**
 * 计算单个师在当前科技、补给、兵力比与地形下的有效战斗属性
 */
function computeDivisionStats(division, nation, province, isAttacker) {
  const tpl = DIVISION_TEMPLATES[division.template] || DIVISION_TEMPLATES.infantry;
  const mods = computeNationTechModifiers(nation);
  const terrain = TERRAIN_TYPES[province?.terrain] || TERRAIN_TYPES.plains;

  const strengthRatio = Math.max(0.15, division.hp / tpl.maxHp);
  const supplyFactor = 0.45 + 0.55 * Math.min(1, Math.max(0, division.supply ?? 1));
  const terrainMod = isAttacker ? terrain.attackMod : terrain.defenseMod;
  const mountainBonus =
    tpl.mountainBonus && (terrain.id === 'mountains' || terrain.id === 'hills')
      ? tpl.mountainBonus
      : 1.0;

  // 防守方享受堑壕与要塞加成；进攻方受要塞削弱
  const entrenchBonus = isAttacker ? 1.0 : 1.0 + Math.min(0.25, (division.entrenchment || 0) * 0.05);
  const fortLevel = province?.fortLevel || 0;
  const fortMod = isAttacker
    ? Math.max(0.4, 1.0 - fortLevel * 0.12)
    : 1.0 + fortLevel * 0.08;

  const composite = strengthRatio * supplyFactor * terrainMod * mountainBonus * entrenchBonus * fortMod;

  const maxOrg = tpl.maxOrg + mods.maxOrgFlat;
  const armor = tpl.armor > 0 ? tpl.armor + mods.armorFlat : 0;
  const piercing = tpl.piercing + mods.piercingFlat;
  // 装甲率（hardness）决定吃硬攻还是软攻比例
  const hardness = tpl.armor >= 20 ? 0.65 : tpl.armor > 0 ? 0.25 : 0.05;

  return {
    softAttack: tpl.softAttack * mods.softAttackMult * composite,
    hardAttack: tpl.hardAttack * mods.hardAttackMult * composite,
    defense: tpl.defense * mods.defenseMult * composite,
    breakthrough: tpl.breakthrough * mods.breakthroughMult * composite,
    armor,
    piercing,
    hardness,
    maxOrg,
    speed: tpl.speed * mods.speedMult * (0.6 + 0.4 * Math.min(1, division.supply ?? 1)),
  };
}

/**
 * 计算单次战斗小时轮次伤害
 * 当一方的装甲值 > 对方穿甲值时，获得装甲优势（输出 +35%，承伤 -40%）
 */
function calculateExchange(attackerStats, defenderStats) {
  const atkRaw =
    attackerStats.softAttack * (1 - defenderStats.hardness) +
    attackerStats.hardAttack * defenderStats.hardness;
  const defRaw =
    defenderStats.softAttack * (1 - attackerStats.hardness) +
    defenderStats.hardAttack * attackerStats.hardness;

  const attackerHasArmorAdv = attackerStats.armor > defenderStats.piercing;
  const defenderHasArmorAdv = defenderStats.armor > attackerStats.piercing;

  // 超过对方防御/突破的部分造成 2.5 倍暴击伤害（简化版 HOI4 命中机制）
  const atkBlocked = Math.min(atkRaw, defenderStats.defense);
  const atkExcess = Math.max(0, atkRaw - defenderStats.defense);
  let dmgToDefender = atkBlocked * 0.08 + atkExcess * 0.22;

  const defBlocked = Math.min(defRaw, attackerStats.breakthrough);
  const defExcess = Math.max(0, defRaw - attackerStats.breakthrough);
  let dmgToAttacker = defBlocked * 0.08 + defExcess * 0.22;

  if (attackerHasArmorAdv) {
    dmgToDefender *= 1.35;
    dmgToAttacker *= 0.6;
  }
  if (defenderHasArmorAdv) {
    dmgToAttacker *= 1.35;
    dmgToDefender *= 0.6;
  }

  return {
    defenderOrgDmg: Math.max(0.4, dmgToDefender * 1.6),
    defenderHpDmg: Math.max(0.15, dmgToDefender * 0.48),
    attackerOrgDmg: Math.max(0.35, dmgToAttacker * 1.45),
    attackerHpDmg: Math.max(0.15, dmgToAttacker * 0.45),
    attackerHasArmorAdv,
    defenderHasArmorAdv,
  };
}

/**
 * 推进单个战区战斗 1 个回合（每 6 游戏小时结算一次）
 * 返回战斗状态：{ status: 'ongoing' | 'attacker_won' | 'defender_won', progress }
 */
function stepBattle(battle, state) {
  const province = state.provinces[battle.provinceId];
  const attackers = battle.attackerIds
    .map((id) => state.divisions[id])
    .filter((d) => d && d.org > 0 && d.hp > 0);
  const defenders = battle.defenderIds
    .map((id) => state.divisions[id])
    .filter((d) => d && d.org > 0 && d.hp > 0);

  if (attackers.length === 0) {
    return { status: 'defender_won', progress: 0 };
  }
  if (defenders.length === 0) {
    return { status: 'attacker_won', progress: 100 };
  }

  // 聚合攻防双方战力（含堆叠惩罚防止无限堆兵）
  const atkStackPenalty = attackers.length > 4 ? Math.max(0.55, 1 - (attackers.length - 4) * 0.08) : 1;
  const defStackPenalty = defenders.length > 4 ? Math.max(0.55, 1 - (defenders.length - 4) * 0.08) : 1;

  const aggAtk = aggregateStats(attackers, state, province, true, atkStackPenalty);
  const aggDef = aggregateStats(defenders, state, province, false, defStackPenalty);

  const exchange = calculateExchange(aggAtk, aggDef);

  // 分摊伤害到参战各师
  for (const d of defenders) {
    d.org = Math.max(0, d.org - exchange.defenderOrgDmg / Math.sqrt(defenders.length));
    d.hp = Math.max(5, d.hp - exchange.defenderHpDmg / Math.sqrt(defenders.length));
  }
  for (const a of attackers) {
    a.org = Math.max(0, a.org - exchange.attackerOrgDmg / Math.sqrt(attackers.length));
    a.hp = Math.max(5, a.hp - exchange.attackerHpDmg / Math.sqrt(attackers.length));
  }

  const atkAlive = attackers.filter((d) => d.org > 1);
  const defAlive = defenders.filter((d) => d.org > 1);

  const atkOrgSum = attackers.reduce((s, d) => s + d.org, 0);
  const defOrgSum = defenders.reduce((s, d) => s + d.org, 0);
  const total = atkOrgSum + defOrgSum;
  const progress = total > 0 ? Math.round((atkOrgSum / total) * 100) : 50;
  battle.progress = progress;
  battle.hoursElapsed = (battle.hoursElapsed || 0) + 6;

  if (defAlive.length === 0) {
    return { status: 'attacker_won', progress: 100 };
  }
  if (atkAlive.length === 0) {
    return { status: 'defender_won', progress: 0 };
  }
  return { status: 'ongoing', progress };
}

function aggregateStats(divisions, state, province, isAttacker, stackPenalty) {
  let softAttack = 0;
  let hardAttack = 0;
  let defense = 0;
  let breakthrough = 0;
  let maxArmor = 0;
  let maxPiercing = 0;
  let hardnessSum = 0;

  for (const div of divisions) {
    const nation = state.nations[div.owner];
    const st = computeDivisionStats(div, nation, province, isAttacker);
    softAttack += st.softAttack;
    hardAttack += st.hardAttack;
    defense += st.defense;
    breakthrough += st.breakthrough;
    maxArmor = Math.max(maxArmor, st.armor);
    maxPiercing = Math.max(maxPiercing, st.piercing);
    hardnessSum += st.hardness;
  }

  return {
    softAttack: softAttack * stackPenalty,
    hardAttack: hardAttack * stackPenalty,
    defense: defense * stackPenalty,
    breakthrough: breakthrough * stackPenalty,
    armor: maxArmor,
    piercing: maxPiercing,
    hardness: divisions.length > 0 ? hardnessSum / divisions.length : 0,
  };
}


// ===== src/engine/economy.js =====
/**
 * 工业经济、资源统计、民用建造队列与军工装备生产引擎
 */
const CONSTRUCTION_COSTS = {
  civFactory: { name: '民用工厂', icCost: 120 },
  milFactory: { name: '军用工厂', icCost: 90 },
  infra: { name: '基础设施', icCost: 60 },
  fort: { name: '陆地要塞', icCost: 50 },
};

/**
 * 统计某国家当前控制的民工、军工与战略资源产出
 */
function computeNationEconomy(nationId, state) {
  const nation = state.nations[nationId];
  const mods = computeNationTechModifiers(nation);
  let civFactories = 0;
  let milFactories = 0;
  const resources = { steel: 0, oil: 0, tungsten: 0 };

  for (const prov of Object.values(state.provinces)) {
    if (prov.owner !== nationId) continue;
    civFactories += prov.civFactories;
    milFactories += prov.milFactories;
    resources.steel += Math.round((prov.resources.steel || 0) * mods.resourceMult);
    resources.oil += Math.round((prov.resources.oil || 0) * mods.resourceMult);
    resources.tungsten += Math.round((prov.resources.tungsten || 0) * mods.resourceMult);
  }

  // 消费品占用约 20% 民工，剩余用于建造
  const consumerGoods = Math.floor(civFactories * 0.2);
  const availableCiv = Math.max(1, civFactories - consumerGoods);

  // 计算军工产线总资源需求
  const resourceNeed = { steel: 0, oil: 0, tungsten: 0 };
  let assignedMil = 0;
  for (const line of nation.productionLines) {
    assignedMil += line.factories;
    const eq = EQUIPMENT_CATALOG[line.equipmentId];
    if (!eq) continue;
    for (const [res, amt] of Object.entries(eq.resources)) {
      resourceNeed[res] += amt * line.factories;
    }
  }

  // 资源缺口效率修正：短缺越多军工产出越低，最低保留 35%
  let efficiency = 1.0;
  for (const res of ['steel', 'oil', 'tungsten']) {
    if (resourceNeed[res] > resources[res] && resourceNeed[res] > 0) {
      const deficitRatio = (resourceNeed[res] - resources[res]) / resourceNeed[res];
      efficiency -= deficitRatio * 0.35;
    }
  }
  efficiency = Math.max(0.35, Math.min(1.0, efficiency));

  return {
    civFactories,
    milFactories,
    availableCiv,
    assignedMil,
    freeMil: Math.max(0, milFactories - assignedMil),
    resources,
    resourceNeed,
    resourceEfficiency: efficiency,
  };
}

/**
 * 每日推进：民用建造队列 + 军工装备生产 + 新师训练队列 + 部队兵力补充
 */
function processDailyEconomy(nationId, state) {
  const nation = state.nations[nationId];
  if (!nation || nation.capitulated) return;

  const mods = computeNationTechModifiers(nation);
  const econ = computeNationEconomy(nationId, state);

  // 若军工数量因占领/损失变化，自动裁剪超额分配的工厂
  let totalAssigned = nation.productionLines.reduce((s, l) => s + l.factories, 0);
  if (totalAssigned > econ.milFactories) {
    let excess = totalAssigned - econ.milFactories;
    for (let i = nation.productionLines.length - 1; i >= 0 && excess > 0; i--) {
      const cut = Math.min(excess, nation.productionLines[i].factories);
      nation.productionLines[i].factories -= cut;
      excess -= cut;
    }
  }

  // 1. 民用建造队列（每日每个可用民工贡献 5 IC）
  if (nation.constructionQueue.length > 0) {
    const task = nation.constructionQueue[0];
    const prov = state.provinces[task.provinceId];
    if (!prov || prov.owner !== nationId) {
      nation.constructionQueue.shift();
    } else {
      const dailyIC = econ.availableCiv * 5.0 * mods.constructionMult;
      task.progress += dailyIC;
      if (task.progress >= task.cost) {
        applyConstructionComplete(prov, task.type);
        nation.constructionQueue.shift();
        state.addLog(`${nation.shortName}在${prov.name}完成了${CONSTRUCTION_COSTS[task.type].name}建设。`, 'economy');
      }
    }
  }

  // 2. 军工生产（每日每个军工产出 4.5 基础 IC）
  for (const line of nation.productionLines) {
    if (line.factories <= 0) continue;
    const eq = EQUIPMENT_CATALOG[line.equipmentId];
    if (!eq) continue;
    const dailyIC = line.factories * 4.5 * mods.factoryOutputMult * econ.resourceEfficiency;
    const produced = dailyIC / eq.icCost;
    nation.equipment[line.equipmentId] = (nation.equipment[line.equipmentId] || 0) + produced;
  }

  // 3. 新建师训练队列
  for (let i = nation.trainingQueue.length - 1; i >= 0; i--) {
    const item = nation.trainingQueue[i];
    item.daysLeft -= 1;
    if (item.daysLeft <= 0) {
      const deployProv =
        state.provinces[item.deployProvinceId]?.owner === nationId
          ? item.deployProvinceId
          : findFallbackCapital(nationId, state);
      if (deployProv) {
        state.spawnDivision(nationId, item.templateId, deployProv);
        state.addLog(
          `${nation.shortName}新编成的${DIVISION_TEMPLATES[item.templateId].name}已在${state.provinces[deployProv].name}部署。`,
          'military'
        );
      }
      nation.trainingQueue.splice(i, 1);
    }
  }

  // 4. 现役部队每日人力与装备补员（非战斗且有补给时缓慢恢复 HP）
  for (const div of Object.values(state.divisions)) {
    if (div.owner !== nationId) continue;
    const tpl = DIVISION_TEMPLATES[div.template] || DIVISION_TEMPLATES.infantry;
    if (div.hp < tpl.maxHp && !div.inCombat && (div.supply ?? 1) >= 0.4) {
      const needHp = Math.min(2.5, tpl.maxHp - div.hp);
      const manpowerNeeded = Math.round((needHp / tpl.maxHp) * tpl.manpower);
      if (nation.manpower >= manpowerNeeded && (nation.equipment.infantry_eq || 0) >= 3) {
        nation.manpower -= manpowerNeeded;
        nation.equipment.infantry_eq -= 3;
        div.hp = Math.min(tpl.maxHp, div.hp + needHp);
      }
    }
  }
}

function applyConstructionComplete(prov, type) {
  if (type === 'civFactory') prov.civFactories += 1;
  else if (type === 'milFactory') prov.milFactories += 1;
  else if (type === 'infra') prov.infra = Math.min(10, prov.infra + 1);
  else if (type === 'fort') prov.fortLevel = Math.min(6, (prov.fortLevel || 0) + 1);
}

function findFallbackCapital(nationId, state) {
  const nation = state.nations[nationId];
  if (state.provinces[nation.capital]?.owner === nationId) return nation.capital;
  const anyOwned = Object.values(state.provinces).find((p) => p.owner === nationId);
  return anyOwned ? anyOwned.id : null;
}

/**
 * 发起新建师训练（扣除人力与装备库存）
 */
function queueDivisionTraining(nationId, templateId, deployProvinceId, state) {
  const nation = state.nations[nationId];
  const tpl = DIVISION_TEMPLATES[templateId];
  if (!nation || !tpl) return { ok: false, reason: '无效编制模板' };
  if (nation.manpower < tpl.manpower) return { ok: false, reason: '可用人力不足' };

  for (const [eqId, cost] of Object.entries(tpl.equipmentCost)) {
    if ((nation.equipment[eqId] || 0) < cost) {
      return { ok: false, reason: `${EQUIPMENT_CATALOG[eqId].name}库存不足` };
    }
  }

  nation.manpower -= tpl.manpower;
  for (const [eqId, cost] of Object.entries(tpl.equipmentCost)) {
    nation.equipment[eqId] -= cost;
  }

  nation.trainingQueue.push({
    id: `train_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
    templateId,
    deployProvinceId: deployProvinceId || nation.capital,
    daysLeft: tpl.trainDays,
    totalDays: tpl.trainDays,
  });
  return { ok: true };
}

/**
 * 添加建造任务到民用队列
 */
function queueConstruction(nationId, provinceId, type, state) {
  const nation = state.nations[nationId];
  const prov = state.provinces[provinceId];
  const spec = CONSTRUCTION_COSTS[type];
  if (!nation || !prov || !spec) return { ok: false, reason: '无效建造参数' };
  if (prov.owner !== nationId) return { ok: false, reason: '只能在本国控制省份建造' };
  if (type === 'infra' && prov.infra >= 10) return { ok: false, reason: '基础设施已满级' };
  if (type === 'fort' && (prov.fortLevel || 0) >= 6) return { ok: false, reason: '要塞已满级' };

  nation.constructionQueue.push({
    id: `build_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
    provinceId,
    type,
    progress: 0,
    cost: spec.icCost,
  });
  return { ok: true };
}


// ===== src/engine/supply.js =====
/**
 * 补给枢纽与前线补给追踪系统
 * 使用广度优先搜索 (BFS) 从首都及补给枢纽出发，经由己方/盟友控制省份计算每省补给水平与师级损耗。
 */



/**
 * 判断某省份是否对指定国家开放补给通行（己方或同阵营盟友）
 */
function isFriendlyProvince(nationId, province, state) {
  if (!province) return false;
  if (province.owner === nationId) return true;
  const n1 = state.nations[nationId];
  const n2 = state.nations[province.owner];
  return Boolean(n1 && n2 && n1.faction && n1.faction === n2.faction);
}

/**
 * 计算指定国家在所有省份的补给连通性与供给能力
 */
function computeSupplyNetwork(nationId, state) {
  const nation = state.nations[nationId];
  if (!nation) return {};

  const visitedDist = {};
  const queue = [];

  // 起点：首都（若仍被己方控制）
  const cap = state.provinces[nation.capital];
  if (cap && isFriendlyProvince(nationId, cap, state)) {
    visitedDist[cap.id] = 0;
    queue.push(cap.id);
  } else {
    // 首都沦陷后，回退至所有己方控制的补给枢纽
    for (const p of Object.values(state.provinces)) {
      if (p.owner === nationId && p.supplyHub) {
        visitedDist[p.id] = 1;
        queue.push(p.id);
      }
    }
  }

  // BFS 计算到首都/补给源的最短跳数
  while (queue.length > 0) {
    const currId = queue.shift();
    const curr = state.provinces[currId];
    const nextDist = visitedDist[currId] + 1;

    for (const nbId of getAllNeighbors(curr)) {
      const nb = state.provinces[nbId];
      if (!isFriendlyProvince(nationId, nb, state)) continue;
      // 经过补给枢纽可重置距离衰减（相当于铁路枢纽中转）
      const effDist = nb.supplyHub ? Math.min(nextDist, 1) : nextDist;
      if (visitedDist[nbId] === undefined || effDist < visitedDist[nbId]) {
        visitedDist[nbId] = effDist;
        queue.push(nbId);
      }
    }
  }

  return visitedDist;
}

/**
 * 更新全部师的补给状态，并对断补或超载师施加每日损耗
 */
function updateAllSupply(state, applyDailyAttrition = false) {
  const networks = {};
  for (const nationId of Object.keys(state.nations)) {
    networks[nationId] = computeSupplyNetwork(nationId, state);
  }

  // 按省份统计各师补给消耗
  const provinceDemand = {};
  for (const div of Object.values(state.divisions)) {
    const nation = state.nations[div.owner];
    const mods = computeNationTechModifiers(nation);
    const tpl = DIVISION_TEMPLATES[div.template] || DIVISION_TEMPLATES.infantry;
    const use = tpl.supplyUse * mods.supplyUseMult;
    provinceDemand[div.provinceId] = (provinceDemand[div.provinceId] || 0) + use;
  }

  for (const prov of Object.values(state.provinces)) {
    const terrain = TERRAIN_TYPES[prov.terrain] || TERRAIN_TYPES.plains;
    const capacity = terrain.supplyLimit + prov.infra * 2 + (prov.supplyHub ? 8 : 0);
    prov.supplyCapacity = capacity;
    prov.supplyUsed = Number((provinceDemand[prov.id] || 0).toFixed(1));
  }

  for (const div of Object.values(state.divisions)) {
    const prov = state.provinces[div.provinceId];
    const dist = networks[div.owner]?.[div.provinceId];

    if (dist === undefined) {
      // 完全断补（被敌军包围）
      div.supply = 0.0;
      div.encircled = true;
    } else {
      div.encircled = false;
      const distFactor = Math.max(0.4, 1.0 - dist * 0.12);
      const cap = prov.supplyCapacity || 10;
      const used = prov.supplyUsed || 1;
      const loadFactor = used <= cap ? 1.0 : Math.max(0.25, cap / used);
      div.supply = Number(Math.min(1.0, distFactor * loadFactor).toFixed(2));
    }

    if (applyDailyAttrition && div.supply < 0.5) {
      const severity = div.encircled ? 1.0 : 0.5 - div.supply;
      div.org = Math.max(2, div.org - severity * 6.5);
      div.hp = Math.max(10, div.hp - severity * 3.0);
    }
  }
}


// ===== src/engine/diplomacy.js =====
/**
 * 外交关系、阵营、宣战、全球紧张度与国家投降结算引擎
 */
function areAtWar(nationA, nationB, state) {
  if (!nationA || !nationB || nationA === nationB) return false;
  return state.wars.some(
    (w) =>
      (w.a === nationA && w.b === nationB) ||
      (w.a === nationB && w.b === nationA)
  );
}
function areAllies(nationA, nationB, state) {
  if (!nationA || !nationB || nationA === nationB) return false;
  const n1 = state.nations[nationA];
  const n2 = state.nations[nationB];
  return Boolean(n1 && n2 && n1.faction && n1.faction === n2.faction);
}
function declareWar(attackerId, defenderId, state) {
  const atk = state.nations[attackerId];
  const def = state.nations[defenderId];
  if (!atk || !def || attackerId === defenderId) {
    return { ok: false, reason: '无效宣战目标' };
  }
  if (atk.capitulated || def.capitulated) {
    return { ok: false, reason: '已投降国家无法宣战' };
  }
  if (areAllies(attackerId, defenderId, state)) {
    return { ok: false, reason: '无法向同阵营盟友宣战' };
  }
  if (areAtWar(attackerId, defenderId, state)) {
    return { ok: false, reason: '双方已处于交战状态' };
  }

  state.wars.push({
    a: attackerId,
    b: defenderId,
    startDate: state.formatDate(),
  });

  state.worldTension = Math.min(100, state.worldTension + 12);
  state.addLog(`⚔️ ${atk.name}向${def.name}正式宣战！全球紧张度升至 ${Math.round(state.worldTension)}%。`, 'war');

  // 触发阵营自动参战（高紧张度或同盟防御条约）
  for (const ally of Object.values(state.nations)) {
    if (ally.capitulated) continue;
    if (ally.id !== defenderId && ally.faction === def.faction && !areAtWar(attackerId, ally.id, state)) {
      state.wars.push({ a: attackerId, b: ally.id, startDate: state.formatDate() });
      state.addLog(`🛡️ ${ally.shortName}履行${def.faction}同盟义务，对${atk.shortName}宣战！`, 'war');
    }
    if (ally.id !== attackerId && ally.faction === atk.faction && !areAtWar(ally.id, defenderId, state)) {
      state.wars.push({ a: ally.id, b: defenderId, startDate: state.formatDate() });
      state.addLog(`🔥 ${ally.shortName}响应${atk.faction}盟友号召，加入对${def.shortName}的战争！`, 'war');
    }
  }

  return { ok: true };
}

/**
 * 计算国家投降进度（基于原始核心领土胜利点 VP 失守比例）
 */
function computeSurrenderProgress(nationId, state) {
  let totalCoreVp = 0;
  let lostCoreVp = 0;

  for (const prov of Object.values(state.provinces)) {
    if (prov.coreOwner === nationId) {
      totalCoreVp += prov.vp;
      if (prov.owner !== nationId) {
        lostCoreVp += prov.vp;
      }
    }
  }

  if (totalCoreVp === 0) return 1.0;
  return Number((lostCoreVp / totalCoreVp).toFixed(3));
}

/**
 * 检查交战国是否达到投降阈值（核心胜利点失守 >= 75% 或丧失全部省份）
 */
function checkCapitulations(state, conqueringNationId) {
  for (const nation of Object.values(state.nations)) {
    if (nation.capitulated) continue;
    const ownedCount = Object.values(state.provinces).filter((p) => p.owner === nation.id).length;
    const surrender = computeSurrenderProgress(nation.id, state);
    nation.surrenderProgress = surrender;

    if (ownedCount === 0 || surrender >= 0.75) {
      nation.capitulated = true;
      // 剩余领土移交给占领国
      const winnerId = conqueringNationId || findPrimaryEnemy(nation.id, state);
      if (winnerId) {
        for (const prov of Object.values(state.provinces)) {
          if (prov.owner === nation.id) {
            prov.owner = winnerId;
          }
        }
      }
      // 解散其残余部队
      for (const [divId, div] of Object.entries(state.divisions)) {
        if (div.owner === nation.id) {
          delete state.divisions[divId];
        }
      }
      // 清理与该国相关的战斗
      state.battles = state.battles.filter(
        (b) => b.attackerNation !== nation.id && b.defenderNation !== nation.id
      );

      state.addLog(`🏳️ ${nation.name}已宣布投降！剩余领土由${state.nations[winnerId]?.shortName || '敌军'}接管。`, 'war');
    }
  }
}

function findPrimaryEnemy(nationId, state) {
  const war = state.wars.find((w) => w.a === nationId || w.b === nationId);
  if (!war) return null;
  return war.a === nationId ? war.b : war.a;
}

/**
 * 国家战略与战术 AI 引擎
 * 负责非玩家国家的：国策选择、科技研发、军工分配、建造、新师招募、前线调动与局部进攻评估。
 */





/**
 * 每日执行一次 AI 国家内政与军事决策
 */
function runNationAI(nationId, state) {
  const nation = state.nations[nationId];
  if (!nation || nation.capitulated || nationId === state.playerNationId) return;

  // 1. 自动选择国家焦点
  if (!nation.activeFocus) {
    const avail = NATIONAL_FOCUSES.filter(
      (f) =>
        !nation.completedFocuses.includes(f.id) &&
        f.prereq.every((p) => nation.completedFocuses.includes(p))
    );
    if (avail.length > 0) {
      const preferred =
        avail.find((f) => nation.aiProfile?.focusPriority?.includes(f.id)) || avail[0];
      state.startFocus(nationId, preferred.id);
    }
  }

  // 2. 自动选择科技研发
  if (!nation.activeTech) {
    const availTech = TECHNOLOGIES.filter(
      (t) =>
        !nation.completedTechs.includes(t.id) &&
        t.prereq.every((p) => nation.completedTechs.includes(p))
    );
    if (availTech.length > 0) {
      state.startResearch(nationId, availTech[0].id);
    }
  }

  // 3. 自动分配空闲军工工厂
  const econ = computeNationEconomy(nationId, state);
  if (econ.freeMil > 0) {
    const targetLine =
      nation.productionLines.find((l) => l.equipmentId === 'infantry_eq') ||
      nation.productionLines[0];
    if (targetLine) targetLine.factories += econ.freeMil;
  }

  // 4. 自动建造（队列为空时优先扩建军工）
  if (nation.constructionQueue.length === 0) {
    const ownedProvs = Object.values(state.provinces).filter((p) => p.owner === nationId);
    if (ownedProvs.length > 0) {
      const targetProv = ownedProvs.find((p) => p.id === nation.capital) || ownedProvs[0];
      queueConstruction(nationId, targetProv.id, 'milFactory', state);
    }
  }

  // 5. 自动训练步兵师（最多保持 2 个并发训练任务）
  if (nation.trainingQueue.length < 2 && nation.manpower > 50000) {
    queueDivisionTraining(nationId, 'infantry', nation.capital, state);
  }

  // 6. 历史趋势外交事件：高侵略性 AI 在完成关键焦点或日期推进后主动宣战
  if (
    nationId === 'GER' &&
    state.totalDays >= 45 &&
    !areAtWar('GER', 'POL', state) &&
    !state.nations.POL.capitulated
  ) {
    declareWar('GER', 'POL', state);
  }

  // 7. 军事前线调度与进攻评估
  manageMilitaryFronts(nationId, state);
}

function manageMilitaryFronts(nationId, state) {
  const myDivs = Object.values(state.divisions).filter(
    (d) => d.owner === nationId && !d.movingTo && !d.inCombat
  );
  if (myDivs.length === 0) return;

  const enemyProvinces = new Set(
    Object.values(state.provinces)
      .filter((p) => areAtWar(nationId, p.owner, state))
      .map((p) => p.id)
  );

  // 处于和平状态：不主动进攻，保持首都与边境驻防
  if (enemyProvinces.size === 0) return;

  // 找出所有接壤敌军的前线省份
  const frontlineProvs = Object.values(state.provinces).filter(
    (p) => p.owner === nationId && getAllNeighbors(p).some((nb) => enemyProvinces.has(nb))
  );

  for (const div of myDivs) {
    if (div.org < 22) continue; // 低组织度先休整

    const currProv = state.provinces[div.provinceId];
    const neighbors = getAllNeighbors(currProv);

    // 优先检查相邻敌省是否可发起优势进攻
    const adjacentEnemies = neighbors.filter((nbId) => enemyProvinces.has(nbId));
    if (adjacentEnemies.length > 0) {
      const myCountHere = Object.values(state.divisions).filter(
        (d) => d.owner === nationId && d.provinceId === currProv.id && d.org >= 20
      ).length;

      let bestTarget = null;
      let bestScore = -Infinity;

      for (const enemyId of adjacentEnemies) {
        const enemyDivs = Object.values(state.divisions).filter(
          (d) => d.provinceId === enemyId && areAtWar(nationId, d.owner, state)
        ).length;
        const score = myCountHere - enemyDivs * 1.1 + (state.provinces[enemyId].vp || 0) * 0.05;
        if (score > bestScore) {
          bestScore = score;
          bestTarget = enemyId;
        }
      }

      if (bestTarget && bestScore >= 0.2) {
        state.orderMoveDivision(div.id, bestTarget);
        continue;
      }
    }

    // 若当前在后方，向前线空虚或薄弱省份增援
    if (adjacentEnemies.length === 0 && frontlineProvs.length > 0) {
      const nextStep = findStepToward(currProv.id, frontlineProvs.map((p) => p.id), nationId, state);
      if (nextStep) {
        state.orderMoveDivision(div.id, nextStep);
      }
    }
  }
}

/**
 * 简单 BFS 寻找后方部队通向前线省份的下一步邻省
 */
function findStepToward(startId, goalIds, nationId, state) {
  const goalSet = new Set(goalIds);
  const visited = new Set([startId]);
  const queue = [{ id: startId, firstStep: null }];

  while (queue.length > 0) {
    const { id, firstStep } = queue.shift();
    if (goalSet.has(id) && firstStep) return firstStep;

    const prov = state.provinces[id];
    for (const nbId of getAllNeighbors(prov)) {
      if (visited.has(nbId)) continue;
      const nb = state.provinces[nbId];
      if (!nb || nb.owner !== nationId) continue;
      visited.add(nbId);
      queue.push({ id: nbId, firstStep: firstStep || nbId });
    }
  }
  return null;
}


// ===== src/engine/gameEngine.js =====
/**
 * Web HOI 核心大战略游戏引擎
 * 统一管理世界状态、时间推进（小时/日）、部队移动与交战、科研/焦点、外交与存档序列化。
 */
class GameEngine {
  constructor(playerNationId = 'GER') {
    this.reset(playerNationId);
  }

  reset(playerNationId = 'GER') {
    this.playerNationId = NATIONS[playerNationId] ? playerNationId : 'GER';
    this.year = 1936;
    this.month = 1;
    this.day = 1;
    this.hour = 0;
    this.totalDays = 0;
    this.worldTension = 10;
    this.paused = true;
    this.speed = 2; // 1..5
    this.nextDivSeq = 1;
    this.wars = [];
    this.battles = [];
    this.logs = [];
    this.provinces = {};
    this.nations = {};
    this.divisions = {};

    // 初始化省份
    for (const p of PROVINCES) {
      this.provinces[p.id] = {
        ...p,
        coreOwner: p.owner,
        fortLevel: p.fortLevel || 0,
        resources: { ...p.resources },
        neighbors: [...p.neighbors],
        seaNeighbors: [...(p.seaNeighbors || [])],
        supplyCapacity: 15,
        supplyUsed: 0,
      };
    }

    // 初始化国家
    for (const [id, n] of Object.entries(NATIONS)) {
      this.nations[id] = {
        ...n,
        equipment: { ...n.startingEquipment },
        completedTechs: [],
        activeTech: null, // { id, daysLeft, totalDays }
        completedFocuses: [],
        activeFocus: null, // { id, daysLeft, totalDays }
        constructionQueue: [],
        trainingQueue: [],
        productionLines: [
          { equipmentId: 'infantry_eq', factories: 3 },
          { equipmentId: 'artillery', factories: 1 },
          { equipmentId: 'trucks', factories: 1 },
          { equipmentId: 'tanks', factories: 2 },
        ],
        capitulated: false,
        surrenderProgress: 0,
      };

      // 按实际初始军工数校准产线工厂数
      const initMil = Object.values(this.provinces)
        .filter((p) => p.owner === id)
        .reduce((s, p) => s + p.milFactories, 0);
      this._balanceInitialProduction(this.nations[id], initMil);

      // 生成初始部队
      for (const d of n.startingDivisions) {
        this.spawnDivision(id, d.template, d.province, d.name);
      }
    }

    updateAllSupply(this, false);
    this.addLog(`1936年1月1日：${this.nations[this.playerNationId].name}进入战备状态。选择部队后右键相邻省份即可行军或进攻。`, 'system');
  }

  _balanceInitialProduction(nation, totalMil) {
    const weights = [0.4, 0.2, 0.15, 0.25];
    let assigned = 0;
    nation.productionLines.forEach((line, idx) => {
      const alloc = idx === nation.productionLines.length - 1
        ? Math.max(0, totalMil - assigned)
        : Math.floor(totalMil * weights[idx]);
      line.factories = alloc;
      assigned += alloc;
    });
  }

  spawnDivision(ownerId, templateId, provinceId, customName = null) {
    const tpl = DIVISION_TEMPLATES[templateId] || DIVISION_TEMPLATES.infantry;
    const nation = this.nations[ownerId];
    const mods = computeNationTechModifiers(nation);
    const id = `div_${this.nextDivSeq++}`;
    this.divisions[id] = {
      id,
      owner: ownerId,
      template: templateId,
      name: customName || `${nation.shortName}第${this.nextDivSeq - 1}${tpl.shortName}师`,
      provinceId,
      hp: tpl.maxHp,
      org: tpl.maxOrg + mods.maxOrgFlat,
      supply: 1.0,
      encircled: false,
      entrenchment: 1,
      movingTo: null,
      moveProgress: 0,
      inCombat: false,
    };
    return this.divisions[id];
  }

  addLog(text, type = 'info') {
    this.logs.unshift({
      date: this.formatDate(),
      text,
      type,
    });
    if (this.logs.length > 80) this.logs.length = 80;
  }

  formatDate() {
    const m = String(this.month).padStart(2, '0');
    const d = String(this.day).padStart(2, '0');
    return `${this.year}-${m}-${d}`;
  }

  /**
   * 推进游戏 6 小时（每 4 次为 1 天）
   */
  tickStep() {
    this.hour += 6;
    const isNewDay = this.hour >= 24;
    if (isNewDay) {
      this.hour = 0;
      this.advanceCalendarDay();
    }

    this.processMovements();
    this.processBattles();

    if (isNewDay) {
      this.processDailyUpdate();
    }
  }

  advanceCalendarDay() {
    const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    this.day += 1;
    this.totalDays += 1;
    if (this.day > daysInMonth[this.month - 1]) {
      this.day = 1;
      this.month += 1;
      if (this.month > 12) {
        this.month = 1;
        this.year += 1;
      }
    }
  }

  /**
   * 命令单个部队向相邻省份移动或发起进攻
   */
  orderMoveDivision(divisionId, targetProvinceId) {
    const div = this.divisions[divisionId];
    if (!div) return { ok: false, reason: '部队不存在' };
    const fromProv = this.provinces[div.provinceId];
    const toProv = this.provinces[targetProvinceId];
    if (!fromProv || !toProv) return { ok: false, reason: '省份无效' };
    if (div.provinceId === targetProvinceId) return { ok: false, reason: '部队已在该省份' };

    const neighbors = getAllNeighbors(fromProv);
    if (!neighbors.includes(targetProvinceId)) {
      return { ok: false, reason: '只能向相邻或海路直连省份移动' };
    }

    const isEnemyProv = areAtWar(div.owner, toProv.owner, this);
    const isFriendlyProv =
      toProv.owner === div.owner ||
      this.nations[div.owner].faction === this.nations[toProv.owner].faction;

    if (!isFriendlyProv && !isEnemyProv) {
      return { ok: false, reason: `未与${this.nations[toProv.owner].shortName}处于交战状态，请先宣战` };
    }

    div.movingTo = targetProvinceId;
    div.moveProgress = 0;
    div.entrenchment = 0;

    // 若目标省份有敌军驻守，立即开启/加入战斗
    if (isEnemyProv) {
      const defenders = Object.values(this.divisions).filter(
        (d) => d.provinceId === targetProvinceId && areAtWar(div.owner, d.owner, this)
      );
      if (defenders.length > 0) {
        this.joinOrCreateBattle(div, targetProvinceId, defenders);
      }
    }
    return { ok: true };
  }

  joinOrCreateBattle(attackerDiv, targetProvinceId, defenders) {
    let battle = this.battles.find(
      (b) => b.provinceId === targetProvinceId && b.attackerNation === attackerDiv.owner
    );
    if (!battle) {
      battle = {
        id: `bat_${targetProvinceId}_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
        provinceId: targetProvinceId,
        attackerNation: attackerDiv.owner,
        defenderNation: defenders[0].owner,
        attackerIds: [],
        defenderIds: defenders.map((d) => d.id),
        progress: 50,
        hoursElapsed: 0,
      };
      this.battles.push(battle);
    }
    if (!battle.attackerIds.includes(attackerDiv.id)) {
      battle.attackerIds.push(attackerDiv.id);
    }
    attackerDiv.inCombat = true;
    for (const def of defenders) {
      if (!battle.defenderIds.includes(def.id)) battle.defenderIds.push(def.id);
      def.inCombat = true;
    }
  }

  processMovements() {
    for (const div of Object.values(this.divisions)) {
      if (!div.movingTo || div.inCombat) continue;

      const targetProv = this.provinces[div.movingTo];
      if (!targetProv) {
        div.movingTo = null;
        continue;
      }

      // 移动途中如目标省出现敌军则转入战斗
      if (areAtWar(div.owner, targetProv.owner, this)) {
        const defenders = Object.values(this.divisions).filter(
          (d) => d.provinceId === targetProv.id && areAtWar(div.owner, d.owner, this)
        );
        if (defenders.length > 0) {
          this.joinOrCreateBattle(div, targetProv.id, defenders);
          continue;
        }
      }

      const nation = this.nations[div.owner];
      const stats = computeDivisionStats(div, nation, targetProv, true);
      const terrain = TERRAIN_TYPES[targetProv.terrain] || TERRAIN_TYPES.plains;
      // 每 6 小时推进进度（100 = 抵达）
      const stepDelta = (stats.speed * 18) / terrain.moveCost;
      div.moveProgress += stepDelta;

      if (div.moveProgress >= 100) {
        div.provinceId = targetProv.id;
        div.movingTo = null;
        div.moveProgress = 0;

        if (areAtWar(div.owner, targetProv.owner, this)) {
          const prevOwner = targetProv.owner;
          targetProv.owner = div.owner;
          this.addLog(
            `🚩 ${nation.shortName}部队占领了${this.nations[prevOwner].shortName}的${targetProv.name}！`,
            'military'
          );
          checkCapitulations(this, div.owner);
        }
      }
    }
  }

  processBattles() {
    for (let i = this.battles.length - 1; i >= 0; i--) {
      const battle = this.battles[i];
      const res = stepBattle(battle, this);

      if (res.status === 'attacker_won') {
        const prov = this.provinces[battle.provinceId];
        // 防守方撤退至相邻友方省份；若无退路则被包围全歼
        for (const defId of battle.defenderIds) {
          const def = this.divisions[defId];
          if (!def) continue;
          def.inCombat = false;
          const retreatProv = getAllNeighbors(prov).find(
            (nbId) => this.provinces[nbId]?.owner === def.owner
          );
          if (retreatProv) {
            def.provinceId = retreatProv;
            def.movingTo = null;
            def.org = Math.max(5, def.org);
          } else {
            this.addLog(`💥 ${def.name}在${prov.name}被包围歼灭！`, 'war');
            delete this.divisions[defId];
          }
        }
        // 进攻方解除战斗并继续快速进入目标省
        for (const atkId of battle.attackerIds) {
          const atk = this.divisions[atkId];
          if (!atk) continue;
          atk.inCombat = false;
          atk.moveProgress = Math.max(atk.moveProgress, 65);
        }
        this.battles.splice(i, 1);
      } else if (res.status === 'defender_won') {
        for (const atkId of battle.attackerIds) {
          const atk = this.divisions[atkId];
          if (!atk) continue;
          atk.inCombat = false;
          atk.movingTo = null;
          atk.moveProgress = 0;
        }
        for (const defId of battle.defenderIds) {
          const def = this.divisions[defId];
          if (def) def.inCombat = false;
        }
        this.battles.splice(i, 1);
      }
    }
  }

  processDailyUpdate() {
    updateAllSupply(this, true);

    for (const nation of Object.values(this.nations)) {
      if (nation.capitulated) continue;

      // 政治点数每日增长
      nation.politicalPower = Number((nation.politicalPower + 1.5 + nation.stability * 0.8).toFixed(1));

      // 科研进度推进
      if (nation.activeTech) {
        nation.activeTech.daysLeft -= 1;
        if (nation.activeTech.daysLeft <= 0) {
          const tech = TECHNOLOGIES.find((t) => t.id === nation.activeTech.id);
          nation.completedTechs.push(nation.activeTech.id);
          nation.activeTech = null;
          if (tech) {
            this.addLog(`🔬 ${nation.shortName}完成科技研发：${tech.name}。`, 'tech');
          }
        }
      }

      // 国家焦点推进
      if (nation.activeFocus) {
        nation.activeFocus.daysLeft -= 1;
        if (nation.activeFocus.daysLeft <= 0) {
          const focus = NATIONAL_FOCUSES.find((f) => f.id === nation.activeFocus.id);
          nation.completedFocuses.push(nation.activeFocus.id);
          nation.activeFocus = null;
          if (focus) {
            this.applyFocusEffect(nation, focus);
          }
        }
      }

      // 工业、生产、建造与补员
      processDailyEconomy(nation.id, this);
    }

    // 非战斗部队恢复组织度与挖掘堑壕
    for (const div of Object.values(this.divisions)) {
      if (div.inCombat) continue;
      const nation = this.nations[div.owner];
      const mods = computeNationTechModifiers(nation);
      const tpl = DIVISION_TEMPLATES[div.template] || DIVISION_TEMPLATES.infantry;
      const maxOrg = tpl.maxOrg + mods.maxOrgFlat;
      if (div.org < maxOrg && div.supply >= 0.4) {
        div.org = Math.min(maxOrg, div.org + 3.2 * mods.orgRecoveryMult * div.supply);
      }
      if (!div.movingTo) {
        div.entrenchment = Math.min(5, (div.entrenchment || 0) + 0.5);
      }
    }

    // 运行所有 AI 国家
    for (const nationId of Object.keys(this.nations)) {
      if (nationId !== this.playerNationId) {
        runNationAI(nationId, this);
      }
    }
  }

  applyFocusEffect(nation, focus) {
    const eff = focus.effect || {};
    const cap = this.provinces[nation.capital];
    if (eff.addCivToCapital && cap && cap.owner === nation.id) cap.civFactories += eff.addCivToCapital;
    if (eff.addMilToCapital && cap && cap.owner === nation.id) cap.milFactories += eff.addMilToCapital;
    if (eff.politicalPower) nation.politicalPower += eff.politicalPower;
    if (eff.stability) nation.stability = Math.min(1, nation.stability + eff.stability);
    if (eff.warSupport) nation.warSupport = Math.min(1, nation.warSupport + eff.warSupport);
    if (eff.manpower) nation.manpower += eff.manpower;
    if (eff.tension) this.worldTension = Math.min(100, this.worldTension + eff.tension);
    if (eff.equipment) {
      for (const [eqId, amt] of Object.entries(eff.equipment)) {
        nation.equipment[eqId] = (nation.equipment[eqId] || 0) + amt;
      }
    }
    this.addLog(`📜 ${nation.shortName}完成国家焦点：${focus.name}。`, 'focus');
  }

  startResearch(nationId, techId) {
    const nation = this.nations[nationId];
    const tech = TECHNOLOGIES.find((t) => t.id === techId);
    if (!nation || !tech) return { ok: false, reason: '无效科技' };
    if (nation.activeTech) return { ok: false, reason: '当前已有正在研发的科技' };
    if (nation.completedTechs.includes(techId)) return { ok: false, reason: '该科技已研发完成' };
    if (!tech.prereq.every((p) => nation.completedTechs.includes(p))) {
      return { ok: false, reason: '前置科技尚未完成' };
    }
    nation.activeTech = { id: tech.id, daysLeft: tech.costDays, totalDays: tech.costDays };
    return { ok: true };
  }

  startFocus(nationId, focusId) {
    const nation = this.nations[nationId];
    const focus = NATIONAL_FOCUSES.find((f) => f.id === focusId);
    if (!nation || !focus) return { ok: false, reason: '无效国家焦点' };
    if (nation.activeFocus) return { ok: false, reason: '当前已有正在执行的焦点' };
    if (nation.completedFocuses.includes(focusId)) return { ok: false, reason: '该焦点已完成' };
    if (!focus.prereq.every((p) => nation.completedFocuses.includes(p))) {
      return { ok: false, reason: '前置焦点尚未完成' };
    }
    nation.activeFocus = { id: focus.id, daysLeft: focus.days, totalDays: focus.days };
    return { ok: true };
  }

  adjustProductionLine(nationId, equipmentId, delta) {
    const nation = this.nations[nationId];
    if (!nation) return { ok: false, reason: '无效国家' };
    const line = nation.productionLines.find((l) => l.equipmentId === equipmentId);
    if (!line) return { ok: false, reason: '产线不存在' };
    const econ = computeNationEconomy(nationId, this);
    if (delta > 0 && econ.freeMil < delta) return { ok: false, reason: '没有空闲军用工厂' };
    if (delta < 0 && line.factories + delta < 0) return { ok: false, reason: '工厂数不能为负' };
    line.factories += delta;
    return { ok: true };
  }

  declareWar(attackerId, defenderId) {
    return declareWar(attackerId, defenderId, this);
  }

  queueConstruction(nationId, provinceId, type) {
    return queueConstruction(nationId, provinceId, type, this);
  }

  queueDivisionTraining(nationId, templateId, deployProvinceId) {
    return queueDivisionTraining(nationId, templateId, deployProvinceId, this);
  }

  /**
   * 序列化完整世界状态为 JSON 字符串（支持存档与回放）
   */
  serialize() {
    return JSON.stringify({
      version: '1.0.0',
      playerNationId: this.playerNationId,
      year: this.year,
      month: this.month,
      day: this.day,
      hour: this.hour,
      totalDays: this.totalDays,
      worldTension: this.worldTension,
      nextDivSeq: this.nextDivSeq,
      wars: this.wars,
      battles: this.battles,
      logs: this.logs,
      provinces: this.provinces,
      nations: this.nations,
      divisions: this.divisions,
    });
  }

  /**
   * 从 JSON 存档恢复游戏状态
   */
  deserialize(jsonStr) {
    const data = typeof jsonStr === 'string' ? JSON.parse(jsonStr) : jsonStr;
    if (!data || !data.provinces || !data.nations) {
      throw new Error('无效存档格式');
    }
    this.playerNationId = data.playerNationId;
    this.year = data.year;
    this.month = data.month;
    this.day = data.day;
    this.hour = data.hour;
    this.totalDays = data.totalDays;
    this.worldTension = data.worldTension;
    this.nextDivSeq = data.nextDivSeq;
    this.wars = data.wars;
    this.battles = data.battles;
    this.logs = data.logs;
    this.provinces = data.provinces;
    this.nations = data.nations;
    this.divisions = data.divisions;
    updateAllSupply(this, false);
  }
}

/**
 * Web Audio API 军事风格合成音效引擎（零外部音频文件依赖）
 */
class SoundEffects {
  constructor() {
    this.muted = false;
    this.ctx = null;
  }

  ensureContext() {
    if (this.muted) return null;
    if (!this.ctx && typeof window !== 'undefined') {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (AudioCtx) this.ctx = new AudioCtx();
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    return this.ctx;
  }

  playTone(freq, duration = 0.08, type = 'triangle', gainVal = 0.08) {
    const ctx = this.ensureContext();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(gainVal, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  }

  click() {
    this.playTone(520, 0.05, 'triangle', 0.05);
  }

  march() {
    this.playTone(220, 0.09, 'sawtooth', 0.06);
    setTimeout(() => this.playTone(280, 0.09, 'sawtooth', 0.05), 70);
  }

  warHorn() {
    this.playTone(146, 0.35, 'sawtooth', 0.09);
    setTimeout(() => this.playTone(110, 0.45, 'sawtooth', 0.09), 180);
  }

  toggleMute() {
    this.muted = !this.muted;
    return this.muted;
  }
}

/**
 * HTML5 Canvas 战略地图渲染器
 * 使用半平面裁剪 (Sutherland-Hodgman) 从省份质心实时生成无接缝 Voronoi 省界多边形，
 * 支持政治/地形/补给三大地图模式、国界线高亮、海路航线、NATO 部队徽标、行军箭头与战斗气泡。
 */



const LOGICAL_W = 1000;
const LOGICAL_H = 640;

/**
 * 使用半平面裁剪计算多边形 P 与垂直平分线 (a -> b) 靠近 a 一侧的交集
 */
function clipPolygonByBisector(poly, ax, ay, bx, by) {
  if (poly.length === 0) return [];
  const mx = (ax + bx) / 2;
  const my = (ay + by) / 2;
  const nx = bx - ax;
  const ny = by - ay;

  const isInside = (p) => (p[0] - mx) * nx + (p[1] - my) * ny <= 0;

  const output = [];
  for (let i = 0; i < poly.length; i++) {
    const curr = poly[i];
    const prev = poly[(i + poly.length - 1) % poly.length];
    const currIn = isInside(curr);
    const prevIn = isInside(prev);

    if (currIn !== prevIn) {
      const dx = curr[0] - prev[0];
      const dy = curr[1] - prev[1];
      const denom = dx * nx + dy * ny;
      if (Math.abs(denom) > 1e-9) {
        const t = ((mx - prev[0]) * nx + (my - prev[1]) * ny) / denom;
        output.push([prev[0] + t * dx, prev[1] + t * dy]);
      }
    }
    if (currIn) output.push(curr);
  }
  return output;
}

/**
 * 判断点是否在多边形内（射线法）
 */
function pointInPolygon(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0];
    const yi = poly[i][1];
    const xj = poly[j][0];
    const yj = poly[j][1];
    const intersect = yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-9) + xi;
    if (intersect) inside = !inside;
  }
  return inside;
}
class MapRenderer {
  constructor(canvas, engine) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.engine = engine;
    this.mapMode = 'political'; // 'political' | 'terrain' | 'supply'
    this.selectedProvinceId = null;
    this.selectedDivisionIds = new Set();
    this.hoverProvinceId = null;
    this.zoom = 1.0;
    this.panX = 0;
    this.panY = 0;
    this.animPhase = 0;

    this.polygons = this.buildProvincePolygons();
  }

  buildProvincePolygons() {
    const result = {};
    const byRegion = { britain: [], mainland: [] };
    for (const p of Object.values(this.engine.provinces)) {
      byRegion[p.region || 'mainland'].push(p);
    }

    for (const [region, list] of Object.entries(byRegion)) {
      const mask = LAND_MASKS[region];
      for (const p of list) {
        let poly = mask.map((pt) => [pt[0], pt[1]]);
        for (const other of list) {
          if (other.id === p.id) continue;
          poly = clipPolygonByBisector(poly, p.x, p.y, other.x, other.y);
        }
        result[p.id] = poly;
      }
    }
    return result;
  }

  resize() {
    const parent = this.canvas.parentElement;
    if (!parent) return;
    const rect = parent.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.canvas.width = Math.max(300, Math.floor(rect.width * dpr));
    this.canvas.height = Math.max(260, Math.floor(rect.height * dpr));
    this.canvas.style.width = `${rect.width}px`;
    this.canvas.style.height = `${rect.height}px`;
    this.dpr = dpr;
    this.viewW = rect.width;
    this.viewH = rect.height;
  }

  getTransform() {
    const baseScale = Math.min(this.viewW / LOGICAL_W, this.viewH / LOGICAL_H);
    const scale = baseScale * this.zoom;
    const offsetX = (this.viewW - LOGICAL_W * scale) / 2 + this.panX;
    const offsetY = (this.viewH - LOGICAL_H * scale) / 2 + this.panY;
    return { scale, offsetX, offsetY };
  }

  screenToLogical(clientX, clientY) {
    const rect = this.canvas.getBoundingClientRect();
    const sx = clientX - rect.left;
    const sy = clientY - rect.top;
    const { scale, offsetX, offsetY } = this.getTransform();
    return {
      x: (sx - offsetX) / scale,
      y: (sy - offsetY) / scale,
    };
  }

  hitTestProvince(lx, ly) {
    for (const [id, poly] of Object.entries(this.polygons)) {
      if (poly.length >= 3 && pointInPolygon(lx, ly, poly)) {
        return id;
      }
    }
    return null;
  }

  render() {
    const ctx = this.ctx;
    if (!this.viewW || !this.viewH) this.resize();
    this.animPhase = (this.animPhase + 0.04) % (Math.PI * 2);

    ctx.save();
    ctx.scale(this.dpr || 1, this.dpr || 1);

    // 1. 海洋背景与经纬网格
    const grad = ctx.createLinearGradient(0, 0, 0, this.viewH);
    grad.addColorStop(0, '#122230');
    grad.addColorStop(1, '#0b1620');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.viewW, this.viewH);

    const { scale, offsetX, offsetY } = this.getTransform();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    this.drawGraticule(ctx);
    this.drawSeaLanes(ctx);
    this.drawProvinces(ctx);
    this.drawNationalHighlights(ctx);
    this.drawSupplyHubsAndNames(ctx);
    this.drawMovementArrows(ctx);
    this.drawDivisions(ctx);
    this.drawBattles(ctx);

    ctx.restore();
  }

  drawGraticule(ctx) {
    ctx.strokeStyle = 'rgba(130, 175, 210, 0.08)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= LOGICAL_W; x += 80) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, LOGICAL_H);
      ctx.stroke();
    }
    for (let y = 0; y <= LOGICAL_H; y += 80) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(LOGICAL_W, y);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(155, 195, 225, 0.25)';
    ctx.font = 'italic 600 13px Inter, sans-serif';
    ctx.fillText('北 海 / NORTH SEA', 250, 125);
    ctx.fillText('英吉利海峡', 140, 282);
    ctx.fillText('地中海 / MEDITERRANEAN', 240, 560);
  }

  drawSeaLanes(ctx) {
    ctx.save();
    ctx.strokeStyle = 'rgba(125, 200, 255, 0.55)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 5]);
    for (const p of Object.values(this.engine.provinces)) {
      for (const sn of p.seaNeighbors || []) {
        if (p.id < sn) {
          const target = this.engine.provinces[sn];
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(target.x, target.y);
          ctx.stroke();
        }
      }
    }
    ctx.restore();
  }

  getProvinceFillColor(prov) {
    if (this.mapMode === 'terrain') {
      return (TERRAIN_TYPES[prov.terrain] || TERRAIN_TYPES.plains).color;
    }
    if (this.mapMode === 'supply') {
      const ratio = prov.supplyCapacity > 0 ? prov.supplyUsed / prov.supplyCapacity : 0;
      if (ratio <= 0.5) return '#2f6e49';
      if (ratio <= 0.85) return '#8d8033';
      return '#9a3434';
    }
    const nation = this.engine.nations[prov.owner];
    return nation ? nation.color : '#555';
  }

  drawProvinces(ctx) {
    for (const prov of Object.values(this.engine.provinces)) {
      const poly = this.polygons[prov.id];
      if (!poly || poly.length < 3) continue;

      ctx.beginPath();
      ctx.moveTo(poly[0][0], poly[0][1]);
      for (let i = 1; i < poly.length; i++) ctx.lineTo(poly[i][0], poly[i][1]);
      ctx.closePath();

      ctx.fillStyle = this.getProvinceFillColor(prov);
      ctx.fill();

      // 悬停或选中高亮
      if (prov.id === this.selectedProvinceId) {
        ctx.fillStyle = 'rgba(255, 224, 130, 0.24)';
        ctx.fill();
      } else if (prov.id === this.hoverProvinceId) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.fill();
      }

      // 省份边界线
      ctx.strokeStyle = prov.id === this.selectedProvinceId ? '#facc15' : 'rgba(15, 22, 28, 0.65)';
      ctx.lineWidth = prov.id === this.selectedProvinceId ? 2.4 : 1.2;
      ctx.stroke();
    }
  }

  drawNationalHighlights(ctx) {
    // 绘制海岸线外轮廓阴影，增强陆海层次感
    ctx.save();
    ctx.strokeStyle = 'rgba(220, 200, 150, 0.45)';
    ctx.lineWidth = 2;
    for (const mask of Object.values(LAND_MASKS)) {
      ctx.beginPath();
      ctx.moveTo(mask[0][0], mask[0][1]);
      for (let i = 1; i < mask.length; i++) ctx.lineTo(mask[i][0], mask[i][1]);
      ctx.closePath();
      ctx.stroke();
    }
    ctx.restore();
  }

  drawSupplyHubsAndNames(ctx) {
    for (const prov of Object.values(this.engine.provinces)) {
      // 首都五角星或城市胜利点
      if (prov.isCapital) {
        ctx.fillStyle = '#facc15';
        ctx.strokeStyle = '#1f2937';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.arc(prov.x, prov.y - 16, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (prov.vp >= 12) {
        ctx.fillStyle = '#e2e8f0';
        ctx.beginPath();
        ctx.arc(prov.x, prov.y - 15, 3, 0, Math.PI * 2);
        ctx.fill();
      }

      // 补给枢纽图标（补给模式或要塞标记）
      if (this.mapMode === 'supply' && prov.supplyHub) {
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(prov.x - 18, prov.y - 22, 8, 8);
      }
      if (prov.fortLevel > 0) {
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '700 9px Inter, sans-serif';
        ctx.fillText(`🛡${prov.fortLevel}`, prov.x + 12, prov.y - 12);
      }

      // 省份名
      ctx.font = prov.isCapital ? '700 12px Inter, sans-serif' : '600 10.5px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(10, 14, 18, 0.85)';
      ctx.fillText(prov.name, prov.x + 1, prov.y + 24);
      ctx.fillStyle = prov.isCapital ? '#fef08a' : '#f1f5f9';
      ctx.fillText(prov.name, prov.x, prov.y + 23);
    }
  }

  drawMovementArrows(ctx) {
    for (const div of Object.values(this.engine.divisions)) {
      if (!div.movingTo) continue;
      const from = this.engine.provinces[div.provinceId];
      const to = this.engine.provinces[div.movingTo];
      if (!from || !to) continue;

      const isAttack = areAtWar(div.owner, to.owner, this.engine);
      ctx.save();
      ctx.strokeStyle = isAttack ? '#ef4444' : '#38bdf8';
      ctx.lineWidth = 3;
      ctx.setLineDash([7, 4]);
      ctx.lineDashOffset = -this.animPhase * 12;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();

      // 箭头头部
      const angle = Math.atan2(to.y - from.y, to.x - from.x);
      const ax = from.x + (to.x - from.x) * 0.68;
      const ay = from.y + (to.y - from.y) * 0.68;
      ctx.setLineDash([]);
      ctx.fillStyle = isAttack ? '#ef4444' : '#38bdf8';
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax - 10 * Math.cos(angle - 0.45), ay - 10 * Math.sin(angle - 0.45));
      ctx.lineTo(ax - 10 * Math.cos(angle + 0.45), ay - 10 * Math.sin(angle + 0.45));
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
  }

  drawDivisions(ctx) {
    // 按省份与所属国家聚合显示 NATO 徽标
    const grouped = {};
    for (const div of Object.values(this.engine.divisions)) {
      const key = `${div.provinceId}__${div.owner}`;
      if (!grouped[key]) grouped[key] = [];
      grouped[key].push(div);
    }

    for (const list of Object.values(grouped)) {
      const first = list[0];
      const prov = this.engine.provinces[first.provinceId];
      const nation = this.engine.nations[first.owner];
      if (!prov || !nation) continue;

      const anySelected = list.some((d) => this.selectedDivisionIds.has(d.id));
      const anyEncircled = list.some((d) => d.encircled);
      const avgOrg =
        list.reduce((s, d) => s + d.org / (DIVISION_TEMPLATES[d.template]?.maxOrg || 60), 0) /
        list.length;
      const avgHp =
        list.reduce((s, d) => s + d.hp / (DIVISION_TEMPLATES[d.template]?.maxHp || 100), 0) /
        list.length;

      const cx = prov.x;
      const cy = prov.y;
      const w = 36;
      const h = 22;

      ctx.save();
      // 阴影与主体卡片
      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.fillRect(cx - w / 2 + 2, cy - h / 2 + 2, w, h);

      ctx.fillStyle = nation.color;
      ctx.fillRect(cx - w / 2, cy - h / 2, w, h);

      ctx.strokeStyle = anySelected ? '#facc15' : '#e2e8f0';
      ctx.lineWidth = anySelected ? 2.4 : 1.2;
      ctx.strokeRect(cx - w / 2, cy - h / 2, w, h);

      // NATO 符号与数量
      const hasArmor = list.some((d) => d.template === 'armor');
      ctx.fillStyle = '#ffffff';
      ctx.font = '700 10px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${hasArmor ? '⬭' : '✕'} ${list.length}`, cx, cy + 2);

      // 组织度条（绿）与兵力条（橙）
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(cx - w / 2 + 2, cy + h / 2 - 5, w - 4, 2);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(cx - w / 2 + 2, cy + h / 2 - 5, (w - 4) * Math.min(1, avgOrg), 2);

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(cx - w / 2 + 2, cy + h / 2 - 2.5, w - 4, 2);
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(cx - w / 2 + 2, cy + h / 2 - 2.5, (w - 4) * Math.min(1, avgHp), 2);

      if (anyEncircled) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(cx + w / 2, cy - h / 2, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '700 8px Inter, sans-serif';
        ctx.fillText('!', cx + w / 2, cy - h / 2 + 3);
      }
      ctx.restore();
    }
  }

  drawBattles(ctx) {
    for (const battle of this.engine.battles) {
      const prov = this.engine.provinces[battle.provinceId];
      if (!prov) continue;
      const bx = prov.x + 22;
      const by = prov.y - 16;
      const pulse = 1 + Math.sin(this.animPhase * 2) * 0.08;

      ctx.save();
      ctx.translate(bx, by);
      ctx.scale(pulse, pulse);

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();

      // 战斗进度环
      const color = battle.progress >= 55 ? '#22c55e' : battle.progress <= 45 ? '#ef4444' : '#facc15';
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 12, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * battle.progress) / 100);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = '700 9px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${battle.progress}`, 0, 3);
      ctx.restore();
    }
  }
}
